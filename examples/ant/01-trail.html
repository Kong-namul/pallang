<!doctype html>
<html lang="ko">
<!--
  개미 01 · 개미 행렬
  위치는 "곡선 길 위의 거리 s + 자기 오른쪽으로 비킨 거리 o" 두 숫자뿐. 속도는 개미마다 다르고,
  앞 개미와 간격이 좁아지면 줄이고, 가끔 뚝 멈췄다 다시 감 → 줄이 뭉쳤다 풀림(가속은 천천히, 멈춤은 빨리).
  마주 오는 개미끼리는 절반쯤 멈춰 서서 더듬이를 빠르게 맞댄 뒤 서로 오른쪽으로 비켜 지나감.
  다리는 이동 거리에 맞춰 도는 삼각대 걸음이라 멈추면 다리도 멈춤. 돌아오는 개미는 부스러기를 물고 조금 느림.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개미 01 · 개미 행렬</title>
<link rel="stylesheet" href="../../assets/base.css">
</head>
<body>
<canvas class="fill" id="cv"></canvas>
<p class="hint">마주치면 <b>더듬이 인사</b> 후 비켜 감 · 가다 <b>뚝</b> 멈췄다 다시 · 돌아올 땐 부스러기</p>

<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

  let W = 0, H = 0, U = 0, L = 14, SPEED = 60;     // L = 개미 몸길이(px), SPEED = 기본 걸음 속도(px/s)

  // ---------------- 테마 색 ----------------
  const theme = { shade: 'rgba(28,48,36,0.26)', muted: '#5b6b62', leaf: '#5d9b5a', dark: false };
  let COL = null;
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    const v = (n, d) => cs.getPropertyValue(n).trim() || d;
    theme.shade = v('--shade', theme.shade); theme.muted = v('--muted', theme.muted); theme.leaf = v('--leaf', theme.leaf);
    theme.dark = matchMedia('(prefers-color-scheme: dark)').matches;
    // 어두운 바탕에선 검은 개미가 안 보이니 호박색 개미로
    COL = theme.dark
      ? { body: '#b9783f', gaster: '#93592a', leg: '#c48a57', sheen: 'rgba(255,236,205,0.35)', crumb: '#f0cf8e', crumbEdge: '#a8823f' }
      : { body: '#2c1c15', gaster: '#1f1410', leg: '#3b2a20', sheen: 'rgba(255,255,255,0.25)', crumb: '#e6bd76', crumbEdge: '#a87a35' };
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readTheme);
  readTheme();

  // ================= 개미 그리기 (복사해서 쓰는 부분) =================
  // a = { x, y, hd(라디안, 0 = 오른쪽), L(몸길이 px), sc(배율), gait(걸음 위상 0~1),
  //       antL, antR(더듬이 추가 각도: + 벌림 / - 앞으로 모음), carry(물고 있는 부스러기 0~1) }
  const LEGS = [[0.12, 0.36, 0.25], [0.05, 0.03, 0.33], [-0.02, -0.33, 0.29]];   // [엉덩이 x, 발 x, 발 y] 몸길이 비율

  /** 그림자 윤곽을 현재 path 에 더함 (여러 마리를 한 번에 fill → 겹쳐도 진해지지 않음) */
  function antShadowPath(c, a) {
    const L = a.L * a.sc;
    c.save();
    c.translate(a.x + L * 0.06, a.y + L * 0.1); c.rotate(a.hd);
    c.moveTo(-0.1 * L, 0); c.ellipse(-0.3 * L, 0, 0.2 * L, 0.13 * L, 0, 0, TAU);
    c.moveTo(0.18 * L, 0); c.ellipse(0.05 * L, 0, 0.13 * L, 0.075 * L, 0, 0, TAU);
    c.moveTo(0.37 * L, 0); c.ellipse(0.27 * L, 0, 0.1 * L, 0.095 * L, 0, 0, TAU);
    c.restore();
  }

  function drawAnt(c, a) {
    const L = a.L;
    c.save();
    c.translate(a.x, a.y); c.rotate(a.hd); c.scale(a.sc, a.sc);
    c.lineCap = 'round'; c.lineJoin = 'round';

    // 다리 3쌍: 삼각대 걸음 (왼앞·오른가운데·왼뒤 ↔ 반대쪽 셋). 디딜 땐 천천히 뒤로, 옮길 땐 빠르게 앞으로
    c.strokeStyle = COL.leg; c.lineWidth = Math.max(0.8, L * 0.045);
    c.beginPath();
    for (let k = 0; k < 3; k++) for (const s of [-1, 1]) {
      const p = (a.gait + ((k + (s > 0 ? 1 : 0)) % 2) * 0.5) % 1;
      const sw = p < 0.6 ? lerp(1, -1, p / 0.6) : lerp(-1, 1, smooth((p - 0.6) / 0.4));
      const up = p < 0.6 ? 0 : Math.sin(Math.PI * (p - 0.6) / 0.4);
      const hx = LEGS[k][0] * L, fx = (LEGS[k][1] + sw * 0.1) * L, fy = s * (LEGS[k][2] - up * 0.035) * L;
      const kx = lerp(hx, fx, 0.5) + (k === 2 ? -0.03 : 0.03) * L, ky = s * LEGS[k][2] * 0.62 * L;
      c.moveTo(hx, s * 0.04 * L); c.lineTo(kx, ky); c.lineTo(fx, fy);
    }
    c.stroke();

    // 더듬이: ㄱ자로 꺾인 두 마디
    c.lineWidth = Math.max(0.7, L * 0.035);
    c.beginPath();
    for (const s of [-1, 1]) {
      const w = s < 0 ? a.antL : a.antR;
      const a1 = s * (0.9 + w), a2 = s * (0.15 + w * 0.7);
      const bx = 0.34 * L, by = s * 0.045 * L;
      const ex = bx + Math.cos(a1) * 0.12 * L, ey = by + Math.sin(a1) * 0.12 * L;
      c.moveTo(bx, by); c.lineTo(ex, ey); c.lineTo(ex + Math.cos(a2) * 0.17 * L, ey + Math.sin(a2) * 0.17 * L);
    }
    c.stroke();

    // 몸: 배 – 배자루 – 가슴 – 머리
    c.fillStyle = COL.gaster;
    c.beginPath(); c.ellipse(-0.3 * L, 0, 0.2 * L, 0.13 * L, 0, 0, TAU); c.fill();
    c.fillStyle = COL.body;
    c.beginPath(); c.arc(-0.085 * L, 0, 0.04 * L, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(0.05 * L, 0, 0.13 * L, 0.072 * L, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(0.27 * L, 0, 0.1 * L, 0.095 * L, 0, 0, TAU); c.fill();
    // 광택: 빛은 항상 화면 왼쪽 위에서 (몸이 돌아도 따라 돌지 않게 되돌려 계산)
    const lx = -0.5 * Math.cos(a.hd) - 0.75 * Math.sin(a.hd), ly = 0.5 * Math.sin(a.hd) - 0.75 * Math.cos(a.hd);
    c.fillStyle = COL.sheen;
    c.beginPath(); c.ellipse((-0.3 + lx * 0.07) * L, ly * 0.05 * L, 0.09 * L, 0.05 * L, 0, 0, TAU); c.fill();
    c.beginPath(); c.arc((0.27 + lx * 0.04) * L, ly * 0.035 * L, 0.035 * L, 0, TAU); c.fill();

    // 물고 있는 부스러기
    if (a.carry > 0.02) {
      const r = a.carry * 0.15 * L, x = 0.37 * L + r;
      c.fillStyle = COL.crumb; c.strokeStyle = COL.crumbEdge; c.lineWidth = Math.max(0.6, L * 0.025);
      c.beginPath();
      c.moveTo(x + r * 1.05, -r * 0.3); c.lineTo(x + r * 0.2, -r); c.lineTo(x - r * 0.9, -r * 0.25);
      c.lineTo(x - r * 0.35, r * 0.9); c.lineTo(x + r * 0.8, r * 0.7); c.closePath();
      c.fill(); c.stroke();
    }
    c.restore();
  }

  // ---------------- 길 (집 → 먹이 곡선, 같은 간격으로 다시 찍음) ----------------
  const CTRL = [[0.14, 0.73], [0.3, 0.46], [0.5, 0.54], [0.68, 0.66], [0.85, 0.34]];
  const trail = { pts: [], ds: 3, len: 1 };
  const nest = { x: 0, y: 0, r: 0 }, food = { x: 0, y: 0, r: 0 };

  function buildTrail() {
    const P = CTRL.map(([fx, fy]) => ({ x: fx * W, y: fy * H }));
    const raw = [];
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
      for (let j = 0; j < 28; j++) {
        const t = j / 28, t2 = t * t, t3 = t2 * t;
        const cr = (a, b, c, d) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (3 * b - a - 3 * c + d) * t3);
        raw.push({ x: cr(p0.x, p1.x, p2.x, p3.x), y: cr(p0.y, p1.y, p2.y, p3.y) });
      }
    }
    raw.push(P[P.length - 1]);
    const ds = trail.ds, out = [raw[0]];
    let need = ds;
    for (let i = 1; i < raw.length; i++) {
      let a = raw[i - 1];
      const b = raw[i];
      let seg = Math.hypot(b.x - a.x, b.y - a.y);
      while (seg >= need) {
        const t = need / seg;
        a = { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) };
        out.push(a); seg -= need; need = ds;
      }
      need -= seg;
    }
    trail.pts = out; trail.len = (out.length - 1) * ds;
    const end = at(trail.len);
    nest.x = out[0].x; nest.y = out[0].y; nest.r = L * 1.7;
    food.r = L * 1.5;
    food.x = end.x + Math.cos(end.ang) * food.r * 0.85; food.y = end.y + Math.sin(end.ang) * food.r * 0.85;
  }
  /** 길 위 거리 s 의 좌표와 진행 각도 */
  function at(s) {
    const n = trail.pts.length;
    const k = clamp(s / trail.ds, 0, n - 1.001), i = Math.floor(k), f = k - i;
    const a = trail.pts[i], b = trail.pts[i + 1];
    const p = trail.pts[Math.max(0, i - 2)], q = trail.pts[Math.min(n - 1, i + 3)];
    return { x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f), ang: Math.atan2(q.y - p.y, q.x - p.x) };
  }

  // ---------------- 개미 ----------------
  const ants = [];
  const pairs = new Map();      // 마주 오는 두 마리의 만남 기록 (인사할지, 인사 끝났는지)

  function makeAnt() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    return { x: 0, y: 0, hd: 0, L, sc: 1, gait: Math.random(), antL: 0, antR: 0, carry: dir < 0 ? 1 : 0, load: dir < 0 ? 1 : 0,
             s: 0, dir, o: 0, sideGoal: 0, lock: false, block: 1, busy: false, touch: null,
             v: 0, v0: rand(0.82, 1.2), state: 'walk', t: 0, dur: 0, pauseT: 0, nextPause: rand(0.4, 4), greetCd: 0,
             endOff: rand(0, 0.7), ph: rand(0, TAU), wf: rand(0.5, 1.1) };
  }
  /** s, o 로부터 화면 좌표를 놓고, 길 방향(자기 진행 방향) 각도를 돌려줌 */
  function place(a) {
    const p = at(a.s), k = a.o * a.dir;
    a.x = p.x - Math.sin(p.ang) * k; a.y = p.y + Math.cos(p.ang) * k;
    return p.ang + (a.dir < 0 ? Math.PI : 0);
  }

  // 바닥 장식 (비율로 기억)
  const pebbles = Array.from({ length: 9 }, () => ({ fx: rand(0.04, 0.96), fy: rand(0.06, 0.9), r: rand(0.25, 0.6), rot: rand(0, 3), e: rand(0.6, 0.9) }));
  const sprigs = Array.from({ length: 6 }, () => ({ fx: rand(0.05, 0.95), fy: rand(0.08, 0.9), a: rand(0, TAU), n: 3 + (Math.random() * 3 | 0), len: rand(0.7, 1.3) }));
  const grains = Array.from({ length: 34 }, () => ({ a: rand(0, TAU), d: rand(0.42, 1.0), r: rand(0.6, 1.3) }));
  const foodShape = Array.from({ length: 9 }, () => rand(0.8, 1.1));
  const chips = Array.from({ length: 5 }, () => ({ a: rand(0, TAU), d: rand(0.1, 0.6), r: rand(0.1, 0.17) }));
  const scraps = Array.from({ length: 10 }, () => ({ a: rand(0, TAU), d: rand(1.05, 1.7), r: rand(0.05, 0.11) }));

  function resize() {
    W = innerWidth; H = innerHeight; U = Math.min(W, H);
    const dpr = devicePixelRatio || 1;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    L = clamp(U * 0.05, 11, 22); SPEED = L * 4.2;
    const old = trail.len;
    buildTrail();
    if (!ants.length) {
      const n = U < 340 ? 14 : 18;
      for (let i = 0; i < n; i++) {
        const a = makeAnt();
        a.s = trail.len * (0.06 + 0.88 * (i + rand(0.1, 0.9)) / n);
        a.hd = place(a); a.v = SPEED * a.v0;
        ants.push(a);
      }
    } else {
      for (const a of ants) { a.s *= trail.len / old; a.L = L; }
    }
  }
  addEventListener('resize', resize);
  resize();

  // ---------------- 한 프레임 ----------------
  function update(dt, now) {
    for (const a of ants) {
      a.block = 1; a.lock = false; a.touch = null; a.busy = false;
      // 길 한가운데만 밟지 않고 좌우로 느릿하게 흔들림 (살짝 우측통행)
      a.sideGoal = L * (0.1 + 0.15 * Math.sin(now * a.wf + a.ph) + 0.07 * Math.sin(now * a.wf * 2.7 + a.ph * 3));
    }
    for (const pr of pairs.values()) if (pr.greet && !pr.done) pr.a.busy = pr.b.busy = true;

    // 1) 두 마리씩: 같은 방향이면 간격 유지, 마주 오면 인사 or 비켜 가기
    for (let i = 0; i < ants.length; i++) for (let j = i + 1; j < ants.length; j++) {
      const A = ants[i], B = ants[j], key = i * 64 + j;
      if (A.state !== 'walk' || B.state !== 'walk') { pairs.delete(key); continue; }
      const gap = (B.s - A.s) * A.dir;                 // A 가 보는 방향으로 B 까지의 거리
      if (A.dir === B.dir) {
        const f = gap > 0 ? A : B;                     // 뒤따르는 쪽
        f.block = Math.min(f.block, clamp((Math.abs(gap) - 1.1 * L) / (0.6 * L), 0, 1));
        continue;
      }
      if (gap > 3 * L || gap < -1.2 * L) { pairs.delete(key); continue; }
      let pr = pairs.get(key);
      if (!pr) {
        pr = { a: A, b: B, t: -1, done: false,
               greet: gap > 1.6 * L && !A.busy && !B.busy && A.greetCd <= 0 && B.greetCd <= 0 && Math.random() < 0.6 };
        if (pr.greet) A.busy = B.busy = true;
        pairs.set(key, pr);
      }
      if (pr.greet && !pr.done) {
        if (gap < 2.2 * L) { A.sideGoal = B.sideGoal = 0; A.lock = B.lock = true; }     // 정면으로 마주 서게
        const k = clamp((gap - 1.12 * L) / (0.6 * L), 0, 1);
        A.block = Math.min(A.block, k); B.block = Math.min(B.block, k);
        if (gap < 1.3 * L) {
          if (pr.t < 0) pr.t = rand(0.35, 0.85);
          pr.t -= dt; A.touch = B; B.touch = A;
          if (pr.t <= 0) { pr.done = true; A.greetCd = rand(0.6, 2.2); B.greetCd = rand(0.6, 2.2); }
        }
      } else if (gap > -0.9 * L) {
        if (!A.lock) A.sideGoal = Math.max(A.sideGoal, 0.4 * L);        // 각자 자기 오른쪽으로
        if (!B.lock) B.sideGoal = Math.max(B.sideGoal, 0.4 * L);
        if (gap > 0 && gap < 1.5 * L) {                                 // 충분히 비킬 때까진 천천히
          const k = clamp((A.o + B.o) / (0.62 * L), 0.25, 1);
          A.block = Math.min(A.block, k); B.block = Math.min(B.block, k);
        }
      }
    }

    // 2) 한 마리씩
    for (const a of ants) {
      a.t += dt; a.greetCd -= dt;
      let want = a.hd, mode = 'walk';
      if (a.state === 'walk') {
        // 가다 서다: 대개 짧게, 가끔 길게 멈춰 냄새를 맡음
        if (a.pauseT > 0) a.pauseT -= dt;
        else {
          a.nextPause -= dt;
          if (a.nextPause <= 0 && a.block > 0.9) {
            a.pauseT = Math.random() < 0.15 ? rand(0.6, 1.1) : rand(0.12, 0.4);
            a.nextPause = rand(1.3, 4.5);
          }
        }
        const vGoal = a.pauseT > 0 ? 0 : SPEED * a.v0 * (a.load ? 0.85 : 1) * a.block;
        a.v = damp(a.v, vGoal, vGoal > a.v ? 6 : 16, dt);            // 출발은 천천히, 멈춤은 빨리
        const o0 = a.o;
        a.o = damp(a.o, a.sideGoal, 6, dt);
        a.s += a.v * a.dir * dt;
        const base = place(a);
        // 옆으로 비키는 만큼 몸도 그쪽으로 틀어짐
        want = base + clamp(Math.atan2((a.o - o0) / dt, Math.max(a.v, SPEED * 0.35)), -0.7, 0.7);
        a.gait += (a.v * dt + Math.abs(a.o - o0)) / (0.95 * L);
        if (a.touch) { want = Math.atan2(a.touch.y - a.y, a.touch.x - a.x); mode = 'drum'; }
        else if (a.pauseT > 0 || a.block < 0.3) mode = 'sweep';
        a.sc = damp(a.sc, 1, 8, dt);

        if (a.dir > 0 && a.s >= trail.len - a.endOff * L) { a.state = 'pick'; a.t = 0; a.dur = rand(0.8, 1.5); }
        else if (a.dir < 0 && a.s <= (0.9 + a.endOff * 0.5) * L) { a.state = 'in'; a.t = 0; }
      } else if (a.state === 'pick') {
        // 먹이 앞: 멈춰서 더듬고 → 한 조각 물고 → 제자리에서 돌아섬
        a.v = damp(a.v, 0, 16, dt);
        if (a.dir > 0) {
          want = Math.atan2(food.y - a.y, food.x - a.x); mode = 'drum';
          if (a.t > a.dur * 0.6) { a.dir = -1; a.o = -a.o; a.load = 1; a.endOff = rand(0, 0.7); }
        } else { want = place(a); }
        if (a.t > a.dur) { a.state = 'walk'; a.pauseT = 0; a.nextPause = rand(1, 4); }
      } else if (a.state === 'in') {
        // 구멍 속으로 작아지며 사라짐
        a.s = Math.max(0, a.s - SPEED * 0.8 * dt); a.o = damp(a.o, 0, 8, dt);
        want = place(a); a.gait += SPEED * 0.8 * dt / (0.95 * L);
        a.sc = damp(a.sc, 0, 9, dt);
        if (a.t > 0.42) { a.state = 'hide'; a.t = 0; a.dur = rand(0.5, 2.4); a.sc = 0; }
      } else if (a.state === 'hide') {
        if (a.t > a.dur) { a.state = 'out'; a.t = 0; a.dir = 1; a.load = 0; a.carry = 0; a.s = 0; a.o = 0; a.hd = place(a); a.v = SPEED * 0.6; }
      } else if (a.state === 'out') {
        a.s += SPEED * 0.7 * dt; a.gait += SPEED * 0.7 * dt / (0.95 * L);
        want = place(a); a.sc = damp(a.sc, 1, 8, dt);
        if (a.s > 1.3 * L) { a.state = 'walk'; a.v = SPEED * 0.7; a.v0 = rand(0.82, 1.2); }
      }

      // 방향은 한 번에 꺾지 않고 따라 돎 (도는 동안에도 발은 움직임)
      const dh = angDiff(a.hd, want) * (1 - Math.exp(-10 * dt));
      a.hd += dh; a.gait = (a.gait + Math.abs(dh) * 0.3) % 1;
      a.carry = damp(a.carry, a.load, 12, dt);

      // 더듬이: 걸을 땐 번갈아 톡톡, 멈추면 크게 휘젓고, 인사할 땐 앞으로 모아 빠르게 두드림
      let l, r;
      if (mode === 'drum')       { l = -0.5 + 0.22 * Math.sin(now * 40 + a.ph); r = -0.5 + 0.22 * Math.sin(now * 40 + a.ph + Math.PI); }
      else if (mode === 'sweep') { l = 0.38 * Math.sin(now * 5.2 + a.ph); r = 0.38 * Math.sin(now * 4.1 + a.ph + 1.9); }
      else                       { l = 0.13 * Math.sin(now * 14 + a.ph); r = 0.13 * Math.sin(now * 14 + a.ph + 2.6); }
      a.antL = damp(a.antL, l, 30, dt); a.antR = damp(a.antR, r, 30, dt);
    }
  }

  // ---------------- 배경 그리기 ----------------
  function blobPath(c, x, y, r, shape) {
    const n = shape.length, pt = (i) => { const a = (i % n) / n * TAU; return [x + Math.cos(a) * r * shape[i % n], y + Math.sin(a) * r * shape[i % n]]; };
    let [px, py] = pt(0), [qx, qy] = pt(1);
    c.moveTo((px + qx) / 2, (py + qy) / 2);
    for (let i = 1; i <= n; i++) {
      [px, py] = pt(i); [qx, qy] = pt(i + 1);
      c.quadraticCurveTo(px, py, (px + qx) / 2, (py + qy) / 2);
    }
  }

  function drawScene() {
    // 자갈·풀
    ctx.fillStyle = theme.muted; ctx.globalAlpha = 0.16;
    for (const p of pebbles) { ctx.beginPath(); ctx.ellipse(p.fx * W, p.fy * H, p.r * L, p.r * L * p.e, p.rot, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = theme.leaf; ctx.globalAlpha = 0.55; ctx.lineWidth = Math.max(1, L * 0.09); ctx.lineCap = 'round';
    ctx.beginPath();
    for (const g of sprigs) for (let i = 0; i < g.n; i++) {
      const a = g.a + (i - (g.n - 1) / 2) * 0.5, x = g.fx * W, y = g.fy * H, l = g.len * L * (1 - Math.abs(i - (g.n - 1) / 2) * 0.15);
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a) * l * 0.6, y + Math.sin(a) * l * 0.6, x + Math.cos(a + 0.3) * l, y + Math.sin(a + 0.3) * l);
    }
    ctx.stroke();

    // 페로몬 길: 넓고 옅은 띠 + 점선
    ctx.strokeStyle = theme.muted; ctx.lineJoin = 'round';
    ctx.beginPath();
    trail.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.globalAlpha = 0.07; ctx.lineWidth = L * 0.95; ctx.stroke();
    ctx.globalAlpha = 0.42; ctx.lineWidth = Math.max(1.3, L * 0.12);
    ctx.setLineDash([0.1, L * 0.42]); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // 개미집: 흙 둔덕 + 구멍
    const g = ctx.createRadialGradient(nest.x, nest.y, nest.r * 0.15, nest.x, nest.y, nest.r);
    g.addColorStop(0, theme.dark ? 'rgba(150,120,88,0.75)' : 'rgba(158,126,88,0.7)');
    g.addColorStop(0.6, theme.dark ? 'rgba(130,105,78,0.4)' : 'rgba(170,140,100,0.4)');
    g.addColorStop(1, 'rgba(160,130,95,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(nest.x, nest.y, nest.r, 0, TAU); ctx.fill();
    ctx.fillStyle = theme.dark ? '#a08766' : '#9a7c58';
    for (const q of grains) { ctx.beginPath(); ctx.arc(nest.x + Math.cos(q.a) * q.d * nest.r, nest.y + Math.sin(q.a) * q.d * nest.r, q.r * L * 0.06, 0, TAU); ctx.fill(); }
    ctx.fillStyle = theme.dark ? '#050706' : '#2a1f16';
    ctx.beginPath(); ctx.ellipse(nest.x, nest.y, nest.r * 0.3, nest.r * 0.26, 0.3, 0, TAU); ctx.fill();

    // 먹이: 과자 조각
    ctx.fillStyle = theme.shade;
    ctx.beginPath(); blobPath(ctx, food.x + food.r * 0.1, food.y + food.r * 0.14, food.r, foodShape); ctx.fill();
    ctx.fillStyle = '#dcaa62'; ctx.strokeStyle = '#a97a3a'; ctx.lineWidth = Math.max(1, L * 0.07);
    ctx.beginPath(); blobPath(ctx, food.x, food.y, food.r, foodShape); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ecc98a';
    ctx.beginPath(); blobPath(ctx, food.x - food.r * 0.06, food.y - food.r * 0.08, food.r * 0.72, foodShape); ctx.fill();
    ctx.fillStyle = '#5a3620';
    for (const q of chips) { ctx.beginPath(); ctx.arc(food.x + Math.cos(q.a) * q.d * food.r, food.y + Math.sin(q.a) * q.d * food.r, q.r * food.r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = COL.crumb;
    for (const q of scraps) { ctx.beginPath(); ctx.arc(food.x + Math.cos(q.a) * q.d * food.r, food.y + Math.sin(q.a) * q.d * food.r, q.r * L, 0, TAU); ctx.fill(); }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawScene();
    ctx.fillStyle = theme.shade;
    ctx.beginPath();
    for (const a of ants) if (a.sc > 0.05) antShadowPath(ctx, a);
    ctx.fill();
    for (const a of ants) {
      if (a.sc <= 0.05) continue;
      // 걸을 때 몸이 좌우로 살짝 뒤뚱 + 인사할 땐 앞뒤로 까딱
      const hd = a.hd, x = a.x, y = a.y;
      a.hd += Math.sin(a.gait * TAU) * 0.07 * Math.min(1, a.v / SPEED);
      if (a.touch) { const n = Math.sin(performance.now() * 0.021 + a.ph) * 0.025 * L; a.x += Math.cos(hd) * n; a.y += Math.sin(hd) * n; }
      drawAnt(ctx, a);
      a.hd = hd; a.x = x; a.y = y;
    }
  }

  let last = null;
  function frame(ms) {
    const dt = last == null ? 0 : clamp((ms - last) / 1000, 0, 0.05);
    last = ms;
    if (dt > 0) update(dt, ms / 1000);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
