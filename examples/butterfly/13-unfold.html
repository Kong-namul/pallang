<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나비 13 · 평면에서 입체로, 그리고 비행 (탑뷰)</title>
<!-- 카메라는 처음부터 끝까지 바로 위(탑뷰). 바닥·종이는 그대로 있고 나비의 각도만 변함.
     1) 평면: 종이 위 납작한 도안 (날개 0°, 높이 0, 그림자 없음)
     2) 입체: 날개가 뿌리부터 들리고 끝은 종이에 붙어 있다가 떨어짐 → 위에서 보면 날개 폭이 좁아짐.
              머리가 들리고(pitch), 그림자가 옆으로 떨어져 나오기 시작
     3) 준비: 느린 날갯짓 두 번, 몸이 좌우로 살짝 흔들림(bank)
     4) 비행: 높이가 올라가며 커지고(원근), 그림자는 멀어지고 흐려짐. 도는 쪽으로 몸 기울임 -->
<link rel="stylesheet" href="../../assets/butterfly.css">
<style>
  .stage { perspective: 700px; perspective-origin: 50% 50%; }
  .floor { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .floor .grid { position: absolute; left: -500px; top: -500px; width: 1000px; height: 1000px;
    background-image: linear-gradient(color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px),
                      linear-gradient(90deg, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(closest-side, #000 35%, transparent); mask-image: radial-gradient(closest-side, #000 35%, transparent); }
  .paper { position: absolute; width: 220px; height: 170px; margin: -85px 0 0 -110px;
    background: color-mix(in srgb, #fff 80%, var(--sky-bot)); border-radius: 4px;
    box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 8px 24px rgba(30,50,40,.12);
    outline: 1.5px dashed color-mix(in srgb, var(--ink) 25%, transparent); outline-offset: -10px; }
  @media (prefers-color-scheme: dark) { .paper { background: #2c3631; } }
  .ghost { opacity: .13; filter: grayscale(1); }
  .ghost .bf-shadow { display: none; }
  .steps { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; font-size: 12px; }
  .steps span { padding: 3px 10px; border-radius: 999px; color: var(--muted); transition: background .3s, color .3s; }
  .steps span.on { background: #d9631e; color: #fff; }
  .read { position: fixed; left: 12px; top: 44px; margin: 0; font: 11px/1.6 ui-monospace, "JetBrains Mono", monospace;
          color: var(--muted); font-variant-numeric: tabular-nums; white-space: pre; }
  .ui button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent);
    background: transparent; color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="floor"><div class="grid"></div><div class="paper" id="paper"></div></div>
</div>
<div class="steps" id="steps"><span>평면</span><span>입체</span><span>준비</span><span>비행</span></div>
<pre class="read" id="read"></pre>
<p class="hint">카메라는 <b>계속 탑뷰</b> · 나비의 각도만 변해요</p>
<div class="ui"><button type="button" id="again">다시</button></div>

<script src="../../assets/butterfly.js"></script>
<script>
  const { Butterfly, Flyer, loop, lerp, clamp, ease, rand, RAD } = BF;
  const stage = document.getElementById('stage');
  const paper = document.getElementById('paper');
  const read = document.getElementById('read');
  const steps = [...document.querySelectorAll('#steps span')];
  let W, H, S;
  const resize = () => {
    W = stage.clientWidth; H = stage.clientHeight; S = Math.min(1.4, W / 340, H / 260);
    paper.style.transform = `scale(${S})`;
  };
  addEventListener('resize', resize); resize();

  // 종이에 남는 흐린 자국 (나비가 떠난 뒤에도 도안 자리가 보이도록)
  const ghost = new Butterfly(stage, { tilt: 0, alt: 0, scale: S });
  ghost.el.classList.add('ghost'); ghost.angle = 0;

  // 탑뷰: tilt 0. 높이는 원근(커짐)과 그림자 밀림(shadowShift)으로 표현
  const b = new Butterfly(stage, { tilt: 0, scale: S, shadowShift: 0.65 });
  const f = new Flyer(b, { speed: 95, edges: false, glides: false });
  let state, t;

  function setState(i) { state = i; t = 0; steps.forEach((s, k) => s.classList.toggle('on', k === i)); }
  function start() {
    Object.assign(b, { x: W / 2, y: H / 2, heading: 0, bank: 0, pitch: 0, alt: 0, glide: 0, rest: 0, phase: 0, angle: 0, lift: 0, scale: S });
    b.bend.fill(0);
    b.el.style.opacity = 1;
    ghost.x = W / 2; ghost.y = H / 2; ghost.scale = S; ghost.render();
    setState(0);
  }
  document.getElementById('again').addEventListener('click', start);
  start();

  loop((dt) => {
    t += dt;
    if (state === 0) {                                   // 평면
      if (t > 1.5) setState(1);
    } else if (state === 1) {                            // 입체: 뿌리부터 들리고 끝은 늦게 떨어짐
      const k = Math.min(1, t / 2.0);
      const root = ease(Math.min(1, t / 1.3));           // 날개 뿌리
      const tip = ease(clamp((t - 0.55) / 1.3, 0, 1));   // 날개 끝 (0.55초 늦게)
      b.angle = 68 * root;
      b.bend.forEach((_, i) => { b.bend[i] = -68 * (root - tip) * (i + 1) / 45; });   // 꺾임 합계 = 뿌리 각도 → 끝은 종이에 평평
      b.alt = 14 * ease(k);
      b.pitch = 16 * ease(clamp((t - 0.8) / 1.2, 0, 1)); // 머리가 들림
      if (k >= 1) { b.phase = 0.02; b.up = 68; setState(2); }
    } else if (state === 2) {                            // 준비: 느린 날갯짓, 몸 흔들
      b.rate = lerp(0.9, 1.6, t / 1.6);
      b.flex = 0.14 * Math.min(1, t / 0.5);               // 휨도 서서히 시작
      b.up = lerp(68, 75, Math.min(1, t / 1.0));
      b.bank = Math.sin(t * 5.2) * 5 * Math.min(1, t);
      b.heading = Math.sin(t * 3.1) * 6;
      b.update(dt);
      if (t > 1.6) {
        // 준비 자세에서 보던 방향·속도 0 그대로 출발 (방향을 갑자기 바꾸면 툭 튐). 그다음 한쪽으로 천천히 휘어 나감
        f.theta = (b.heading - 90) / RAD;
        f.turn = rand(0.9, 1.6) * (Math.random() < 0.5 ? -1 : 1);
        f.side = 0; f.sideGoal = 0; f.glideT = 0; f.v = 0; f.boost = 0.8; f.target = null;
        setState(3);
      }
    } else if (state === 3) {                            // 비행
      f.altOverride = Math.min(110, 14 + t * 60);
      f.step(dt, W, H);
      b.pitch = lerp(b.pitch, t < 1.4 ? 30 : 14, Math.min(1, dt * 3)); // 솟을 땐 머리를 더 듦
      b.update(dt);
      if (b.x < -160 || b.x > W + 160 || b.y < -160 || b.y > H + 160 || t > 7) {
        b.el.style.opacity = Math.max(0, +b.el.style.opacity - dt * 3);
        if (+b.el.style.opacity <= 0) { state = -1; setTimeout(start, 500); }
      }
    }
    b.render();
    // 그림자: 종이에 붙어 있을 땐 없음 → 떠오를수록 나타났다가, 높아지면 다시 옅어짐
    if (state <= 1) b.shadow.style.opacity = clamp(b.alt / 14, 0, 1).toFixed(3);
    read.textContent =
      `날개  ${b.angle.toFixed(0).padStart(4)}°\n` +
      `pitch ${b.pitch.toFixed(0).padStart(4)}°\n` +
      `bank  ${b.bank.toFixed(0).padStart(4)}°\n` +
      `높이  ${b.alt.toFixed(0).padStart(4)}px`;
  });
</script>
</body>
</html>
