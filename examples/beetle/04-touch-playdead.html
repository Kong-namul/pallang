<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풍뎅이 04 · 건드리면 죽은 척</title>
<!-- 건드리면: 움찔(닿은 반대쪽으로 튐) → 다리·더듬이를 0.2초 만에 몸에 착 붙이고 머리를 움츠림 → 한쪽으로 살짝 기운 채 굳음.
     굳은 동안 또 찌르면 조약돌처럼 밀리고 흔들릴 뿐, 죽은 척 시간이 늘어남.
     잠시 뒤 더듬이 하나가 조심스레 나왔다 멈칫 → 다른 더듬이 → 다리가 하나씩 펴짐 → 평소보다 빠르게 도망.
     다리는 "걷는 자세(IK)"와 "움츠린 자세"를 다리마다 따로 섞어서(0~1) 순서대로 펴지게 만듦. -->
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .stage { touch-action: none; cursor: pointer; }
  .ring { position: absolute; width: 0; height: 0; pointer-events: none; }
  .ring::after { content: ''; position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid var(--accent); animation: ring .5s ease-out forwards; }
  @keyframes ring { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>
<canvas class="fill" id="ground"></canvas>
<div class="stage" id="stage"></div>
<p class="hint">풍뎅이를 <b>톡</b> 건드려 보세요 · 죽은 척하다 도망가요</p>

<script src="../../assets/beetle.js"></script>
<script>
  const { makeBeetle, Gait, Spring, loop, makeNoise, clamp, lerp, rand, ease, easeOut, smooth, angDiff, RAD, TAU } = BT;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('ground');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    const dpr = devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#24302a';
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = ink;
    for (let i = 0; i < W * H / 300; i++) { ctx.globalAlpha = rand(0.03, 0.09); ctx.beginPath(); ctx.arc(rand(0, W), rand(0, H), rand(0.4, 1.2), 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  addEventListener('resize', resize); resize();

  const scale = () => clamp(Math.min(W, H) / 300, 0.8, 1.9);
  const b = makeBeetle(stage, { x: W * 0.5, y: H * 0.55, heading: rand(0, 360), scale: scale(), legShadow: true });
  addEventListener('resize', () => { b.scale = scale(); });
  const g = new Gait(b, { stride: 13 });

  /* ---------- 움츠린 자세 (다리를 몸 밑으로 접음) ---------- */
  const TUCK = [{ fem: 50, tib: -158, lift: -4 }, { fem: 68, tib: -164, lift: -6 }, { fem: 80, tib: -166, lift: -6 }];
  const tuckW = b.legs.map(() => 0);      // 다리마다 0(걷기) ~ 1(움츠림)
  const ants = [0, 1].map(() => ({ a: new Spring(-62, 260, 16), b: new Spring(-16, 300, 15), fan: new Spring(0.35, 200, 14), next: 0, hold: false }));
  const rollS = new Spring(0, 180, 7), altS = new Spring(4, 260, 12);

  /* ---------- 상태 ---------- */
  let st = 'walk', t = 0, deadFor = 0, order = [], touch = { x: 0, y: 0 }, fleeT = 0;
  let speed = 0, omega = 0, cruise = 42, pausing = false, pauseT = 0, nextPause = rand(3, 7);
  const wanderN = makeNoise(0.13), speedN = makeNoise(0.3);
  let push = { x: 0, y: 0 };               // 움찔·찌르기로 밀린 속도

  function ring(x, y) {
    const r = document.createElement('div'); r.className = 'ring';
    r.style.left = x + 'px'; r.style.top = y + 'px';
    stage.appendChild(r); setTimeout(() => r.remove(), 600);
  }
  function away(px, py, k) {            // 닿은 점에서 반대쪽으로 밀기
    const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy) || 1;
    push.x += dx / d * k; push.y += dy / d * k;
  }

  stage.addEventListener('pointerdown', (e) => {
    const r = stage.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    ring(px, py);
    const d = Math.hypot(px - b.x, py - b.y), hitR = Math.max(34, 40 * b.scale);
    touch = { x: px, y: py };
    if (d < hitR) {
      if (st === 'dead' || st === 'tuck') {
        // 죽은 척 중: 조약돌처럼 밀리고 흔들릴 뿐, 시간만 늘어남
        deadFor = Math.min(deadFor + rand(1, 1.8), t + 4.5);
        away(px, py, 60 * b.scale); rollS.v += rand(-90, 90); b.heading += rand(-6, 6);
      } else if (st !== 'flinch') {
        st = 'flinch'; t = 0;
        away(px, py, 140 * b.scale);
        b.sway.h += rand(-7, 7);
        rollS.x = b.roll; rollS.v = 0;
      }
    } else if (d < hitR * 3 && st === 'walk') {
      // 근처를 찌르면: 잠깐 얼어붙었다 반대쪽으로 종종
      pausing = true; pauseT = rand(0.25, 0.45); fleeT = 1.2;
      ants.forEach((A) => { A.a.target = -50; A.fan.target = 1; A.next = 0.3; });
    }
  });

  loop((dt, now) => {
    t += dt;
    // 밀린 속도 (마찰로 빨리 멈춤)
    b.x += push.x * dt; b.y += push.y * dt;
    const fr = Math.exp(-dt * (st === 'dead' ? 9 : 14)); push.x *= fr; push.y *= fr;

    if (st === 'walk' || st === 'flee') {
      if (st === 'flee' && (fleeT -= dt) <= 0) st = 'walk';
      if (pausing) { if ((pauseT -= dt) <= 0) { pausing = false; nextPause = rand(3.5, 8); cruise = rand(32, 52); } }
      else if (st === 'walk' && fleeT <= 0 && (nextPause -= dt) <= 0) { pausing = true; pauseT = rand(1, 2.4); }
      fleeT = Math.max(0, fleeT - dt * (st === 'walk' ? 1 : 0));
      const hurry = st === 'flee' ? 1 : fleeT > 0 ? 0.6 : 0;
      const want = pausing ? 0 : lerp(cruise * (0.82 + 0.18 * speedN(now)), 105, hurry);
      speed = lerp(speed, want, Math.min(1, dt * (want > speed ? 2.4 + hurry * 4 : 6)));
      const m = Math.min(W, H) * 0.16;
      let turn = wanderN(now) * 70;
      if (hurry > 0) turn += angDiff(b.heading / RAD, Math.atan2(b.x - touch.x, -(b.y - touch.y))) * RAD * 2.2 * hurry;
      const edge = Math.max(0, (m - b.x) / m, (b.x - (W - m)) / m, (m - b.y) / m, (b.y - (H - m)) / m);
      if (edge > 0) turn += angDiff(b.heading / RAD, Math.atan2(W / 2 - b.x, -(H / 2 - b.y))) * RAD * edge * 3.4;
      const moving = clamp(speed / 30, 0, 1);
      omega = lerp(omega, clamp(turn, -160, 160) * (0.2 + 0.8 * moving), Math.min(1, dt * 4));
      b.heading += omega * dt;
      const h = b.heading / RAD;
      b.x += Math.sin(h) * speed * b.scale * dt; b.y -= Math.cos(h) * speed * b.scale * dt;
      g.step(dt, speed, omega);
      b.alt = 4 + b.bob;
      b.headYaw = lerp(b.headYaw, clamp(omega * 0.1, -7, 7), Math.min(1, dt * 7));
      b.headPull = lerp(b.headPull, 0, dt * 6);
      for (let i = 0; i < 6; i++) tuckW[i] = Math.max(0, tuckW[i] - dt * 5);
    } else if (st === 'flinch') {             // 움찔: 0.1초 만에 다리·더듬이 착
      b.sway.h *= Math.exp(-dt * 10);
      b.legs.forEach((L, i) => { tuckW[i] = Math.min(1, tuckW[i] + dt * rand(6, 9)); });
      b.headPull = lerp(b.headPull, 2.6, dt * 20);
      ants.forEach((A) => { A.a.target = 58; A.b.target = 40; A.fan.target = 0; A.next = 9; A.a.k = 600; });
      if (t > 0.14) { st = 'tuck'; t = 0; deadFor = rand(1.5, 3); speed = 0; altS.x = b.alt; altS.v = 0; rollS.target = 0; }
    } else if (st === 'tuck' || st === 'dead') {  // 굳음: 배가 바닥에 닿고 한쪽으로 살짝 기울어짐
      b.legs.forEach((L, i) => { tuckW[i] = Math.min(1, tuckW[i] + dt * 8); });
      if (st === 'tuck') {
        altS.target = 2.4;
        if (t > 0.18) { st = 'dead'; rollS.target = (Math.random() < 0.5 ? -1 : 1) * rand(6, 12); }
      }
      b.alt = altS.step(dt); b.roll = rollS.step(dt);
      b.sway.h *= Math.exp(-dt * 10);
      if (st === 'dead' && t > deadFor) {
        st = 'peek'; t = 0;
        const first = Math.random() < 0.5 ? 0 : 1;
        order = [first, 1 - first];
      }
    } else if (st === 'peek') {               // 더듬이 하나가 조심스레 → 멈칫 → 씰룩 → 다른 하나
      const [p, q] = order;
      const A = ants[p], B = ants[q];
      A.a.k = 120; B.a.k = 120;
      if (t < 0.4) { A.a.target = lerp(58, -10, ease(t / 0.4)); A.fan.target = 0.2; }
      else if (t < 0.65) { A.a.target = -10; }
      else { A.a.target = -55 + Math.sin(t * 30) * 8; A.fan.target = 0.9; A.b.target = -20; }
      if (t > 0.75) { B.a.target = -40; B.b.target = -10; B.fan.target = 0.6; }
      b.alt = altS.step(dt); b.roll = rollS.step(dt);
      if (t > 1.0) {
        st = 'unfold'; t = 0;
        // 다리는 앞→가운데→뒤 순서, 좌우는 랜덤. 사이 간격도 들쭉날쭉
        const idx = [0, 3, 1, 4, 2, 5];
        for (let k = 0; k < 6; k += 2) if (Math.random() < 0.5) [idx[k], idx[k + 1]] = [idx[k + 1], idx[k]];
        let at = 0;
        order = idx.map((i) => { const o = { i, at }; at += rand(0.06, 0.15); return o; });
        b.legs.forEach((L) => { L.foot = { x: L.rest.x, y: L.rest.y }; });
        g.plantAll();
        ants.forEach((X) => { X.a.k = 260; X.next = 0; });
      }
    } else if (st === 'unfold') {             // 다리를 하나씩 펴고 몸을 일으킴
      order.forEach((o) => { if (t > o.at) tuckW[o.i] = Math.max(0, 1 - easeOut((t - o.at) / 0.2)); });
      const out = order.filter((o) => t > o.at + 0.1).length;
      altS.target = lerp(2.4, 4, out / 6); rollS.target = lerp(rollS.target, 0, dt * 6);
      b.alt = altS.step(dt); b.roll = rollS.step(dt);
      b.headPull = lerp(b.headPull, 0, dt * 8);
      g.step(dt, 0, 0);
      if (t > order[5].at + 0.25) {
        st = 'flee'; t = 0; fleeT = rand(2, 3); pausing = false; b.roll = 0; b.alt = 4;
        b.heading += angDiff(b.heading / RAD, Math.atan2(b.x - touch.x, -(b.y - touch.y))) * RAD * 0.3;
      }
    }

    // 더듬이 (평소엔 랜덤 씰룩, 움츠린 동안엔 고정)
    const tucked = st === 'flinch' || st === 'tuck' || st === 'dead' || st === 'peek';
    ants.forEach((A, i) => {
      if (!tucked && (A.next -= dt) <= 0) {
        const busy = pausing || st === 'flee';
        A.a.target = -64 + rand(-18, 14) * (busy ? 1.3 : 0.6); A.b.target = rand(-34, 2); A.fan.target = rand(0.25, 0.9);
        A.next = rand(0.15, busy ? 0.5 : 1.3);
      }
      b.ant[i].a = A.a.step(dt); b.ant[i].b = A.b.step(dt); b.ant[i].fan = A.fan.step(dt);
    });

    // 다리: 걷기(IK) 자세와 움츠린 자세를 다리마다 섞음
    b.legs.forEach((L, i) => {
      const r = b.ik(L, L.foot.x, L.foot.y), T = TUCK[i % 3], w = ease(tuckW[i]);
      L.ik = false;
      L.fem = lerp(r.fem, T.fem, w);
      L.tib = lerp(r.tib, T.fem + T.tib, w);
      L.lift = lerp(L.lift, T.lift, w);
      L.tar = lerp(L.tarRest, -60, w);
    });
    b.render();
  });
</script>
</body>
</html>
