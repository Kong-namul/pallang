<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매미 01 · 나무에 붙어 울기</title>
<!-- 나무줄기를 정면에서 봄(매미 등 쪽). 두 마리가 번갈아 울어요.
     울음 한 번 = 조용 → 점점 빨라짐(6→21회/초) → 쭉 이어짐 → 잦아듦. 배가 그 박자로 떨리고 소리 물결이 퍼짐.
     조용할 땐 가끔 줄기를 몇 걸음 올라감(삼각 보행). 손이 가까이 오면 울음을 뚝 그치고 몸을 붙임. -->
<link rel="stylesheet" href="../../assets/base.css">
<style> .stage { touch-action: none; } </style>
</head>
<body>
<div class="stage"><canvas class="fill" id="cv"></canvas></div>
<p class="hint">둘이 <b>번갈아</b> 울어요 · 가까이 가면 울음을 <b>뚝</b> 그쳐요</p>

<script src="../../assets/cicada.js"></script>
<script>
(() => {
  'use strict';
  const { drawCicada, paintTrunkScene, loop, clamp, lerp, rand, easeInOut, TAU } = CI;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const bg = document.createElement('canvas');
  let W, H, S, dpr, trunk;

  function resize() {
    W = innerWidth; H = innerHeight; dpr = devicePixelRatio || 1;
    S = clamp(Math.min(W, H) / 320, 0.8, 2.4);
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    bg.width = cv.width; bg.height = cv.height;
    const g = bg.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    trunk = paintTrunkScene(g, W, H, S);
    for (const c of cicadas) { c.x = lerp(trunk.x0, trunk.x1, c.fx); c.y = clamp(c.y || H * c.fy, H * 0.15, H * 0.85); }
  }

  // 매미 한 마리
  const make = (fx, fy, wait) => ({
    fx, fy, x: 0, y: 0, a: -Math.PI / 2 + rand(-0.12, 0.12),
    phase: 'quiet', t: 0, dur: wait, amp: 0, rate: 6, pp: 0, ringT: 0, rings: [],
    walkT: -1, wk: 0, legs: 0, freeze: 0, jx: 0, jy: 0,
  });
  const cicadas = [make(0.36, 0.34, 0.4), make(0.62, 0.66, 3.2)];
  addEventListener('resize', resize); resize();

  const ptr = { x: 0, y: 0, on: false };
  cv.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || ptr.down) Object.assign(ptr, { x: e.clientX, y: e.clientY, on: true }); });
  cv.addEventListener('pointerdown', (e) => Object.assign(ptr, { x: e.clientX, y: e.clientY, on: true, down: true }));
  addEventListener('pointerup', (e) => { ptr.down = false; if (e.pointerType !== 'mouse') ptr.on = false; });
  cv.addEventListener('pointerleave', () => { ptr.on = false; ptr.down = false; });

  function setPhase(c, phase, dur) { c.phase = phase; c.t = 0; c.dur = dur; }

  function update(c, other, dt) {
    c.t += dt;
    const d = ptr.on ? Math.hypot(ptr.x - c.x, ptr.y - c.y) : 1e9;
    // 손이 가까우면 바로 굳고, 멀어지면 천천히 풀림
    c.freeze = d < 95 * S ? Math.min(1, c.freeze + dt * 6) : Math.max(0, c.freeze - dt * 0.6);
    if (c.freeze > 0.3 && c.phase !== 'quiet') setPhase(c, 'quiet', rand(1.5, 3));

    let target = 0;
    const k = Math.min(1, c.t / c.dur);
    if (c.phase === 'quiet') {
      // 조용할 땐 가끔 줄기를 몇 걸음 올라감
      if (c.walkT < 0 && c.freeze < 0.05 && c.t > 0.4 && !c.walked && Math.random() < 0.006) {
        c.walked = true; c.walkT = 0; c.wy0 = c.y;
        c.wdist = c.y > H * 0.22 ? rand(14, 30) * S : -rand(10, 20) * S;   // 너무 위면 살짝 내려옴
        c.wdur = Math.abs(c.wdist) / (20 * S);
      }
      // 다른 매미가 울고 있으면 끝날 무렵에 이어 받음
      const otherBusy = other.phase === 'build' || (other.phase === 'sustain' && other.t < other.dur * 0.6);
      if (k >= 1 && c.freeze < 0.05 && c.walkT < 0 && !otherBusy) setPhase(c, 'build', 1.4);
    } else if (c.phase === 'build') {
      target = k; c.rate = lerp(6, 21, k);
      if (k >= 1) setPhase(c, 'sustain', rand(2, 3.5));
    } else if (c.phase === 'sustain') {
      target = 1; c.rate = 21 + Math.sin(c.t * 3) * 1.5;
      if (k >= 1) setPhase(c, 'decay', 0.9);
    } else if (c.phase === 'decay') {
      target = 1 - k; c.rate = lerp(21, 9, k);
      if (k >= 1) { setPhase(c, 'quiet', rand(2, 4.5)); c.walked = false; }
    }
    c.amp = lerp(c.amp, target, Math.min(1, dt * (c.freeze > 0.3 ? 14 : 6)));
    c.pp += dt * c.rate * TAU;
    c.pulse = c.amp * (0.5 + 0.5 * Math.sin(c.pp));
    c.jx = (Math.random() - 0.5) * c.amp * 0.5 * S;   // 울 때 몸이 미세하게 떨림
    c.jy = (Math.random() - 0.5) * c.amp * 0.5 * S;
    c.legs = lerp(c.legs, c.freeze * 0.35, Math.min(1, dt * 8));   // 굳을 땐 몸을 줄기에 붙임

    // 걷기
    if (c.walkT >= 0) {
      c.walkT += dt;
      const wk = Math.min(1, c.walkT / c.wdur);
      c.y = c.wy0 - c.wdist * easeInOut(wk);
      c.wk += dt * 14;
      c.a = -Math.PI / 2 + Math.sin(c.walkT * 5) * 0.06;
      if (wk >= 1 || c.freeze > 0.3) c.walkT = -1;
    } else {
      c.wk = lerp(c.wk, Math.round(c.wk / Math.PI) * Math.PI, Math.min(1, dt * 8));   // 다리를 제자리로
    }

    // 소리 물결
    if (c.amp > 0.15 && (c.ringT -= dt) <= 0) { c.ringT = 1 / (3 + c.amp * 4); c.rings.push({ r: 8 * S, a: c.amp }); }
    for (const r of c.rings) r.r += dt * (70 + 40 * r.a) * S;
    while (c.rings.length && c.rings[0].r > 140 * S) c.rings.shift();
  }

  loop((dt) => {
    update(cicadas[0], cicadas[1], dt);
    update(cicadas[1], cicadas[0], dt);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (const c of cicadas) {   // 그림자: 줄기에 붙어 있어서 아주 가까이
      ctx.save(); ctx.translate(c.x + 1.5 * S, c.y + 2.5 * S); ctx.rotate(c.a); ctx.scale(S, S);
      ctx.fillStyle = 'rgba(20,12,4,0.35)';
      ctx.beginPath(); ctx.ellipse(-10, 0, 34, 12, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    for (const c of cicadas) {
      ctx.save(); ctx.translate(c.x + c.jx, c.y + c.jy); ctx.rotate(c.a); ctx.scale(S, S);
      drawCicada(ctx, { pulse: c.pulse, legs: c.legs, walk: c.wk, open: 0 });
      ctx.restore();
      // 배에서 양옆으로 퍼지는 소리 물결
      const ax = c.x + Math.cos(c.a) * -15 * S, ay = c.y + Math.sin(c.a) * -15 * S;
      for (const r of c.rings) {
        const fade = 1 - r.r / (140 * S);
        ctx.strokeStyle = `rgba(255,248,228,${(0.55 * r.a * fade).toFixed(3)})`;
        ctx.lineWidth = 1.8 * S * fade;
        for (const side of [-1, 1]) {
          const mid = c.a + side * Math.PI / 2;
          ctx.beginPath(); ctx.arc(ax, ay, r.r, mid - 0.6, mid + 0.6); ctx.stroke();
        }
      }
    }
  });
})();
</script>
</body>
</html>
