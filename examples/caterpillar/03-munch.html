<!doctype html>
<html lang="ko">
<!--
  애벌레 03 · 잎 갉아먹기
  잎은 SVG <mask> 로 그리고, 한 입 먹을 때마다 마스크에 검은 원을 하나씩 쌓아 가장자리를 물결 모양으로 파냄.
  머리는 "살짝 뒤로 뺐다가(예비 동작) 호를 그리며 쭉" 물고, 턱을 빠르게 여닫으며 씹는 동안 부스러기가 떨어짐.
  한 줄 먹으면 반대 방향으로 한 줄 더 깊게, 그다음 몸 전체가 꼬리부터 파동으로 한 칸 앞으로 이동.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애벌레 03 · 잎 갉아먹기</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 0.5s; }
  #scene.fade { opacity: 0; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <filter id="leafShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" style="flood-color: var(--shade)" flood-opacity="1"/>
    </filter>
    <linearGradient id="leafShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="segFill" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#c6e88a"/><stop offset="0.55" stop-color="#8cc152"/><stop offset="1" stop-color="#4f8a2b"/>
    </radialGradient>
    <radialGradient id="headFill" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#b3cf62"/><stop offset="1" stop-color="#46621c"/>
    </radialGradient>
    <mask id="bites" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="300">
      <rect width="400" height="300" fill="#fff"/>
      <g id="biteLayer" fill="#000"></g>
    </mask>
  </defs>
  <g filter="url(#leafShadow)">
    <g mask="url(#bites)">
      <path id="stem" fill="none" stroke-linecap="round"/>
      <path id="leaf" style="fill: var(--leaf)" stroke="rgba(30,70,30,0.45)" stroke-width="1"/>
      <path id="leafShade" fill="url(#leafShine)"/>
      <path id="veins" fill="none" stroke="rgba(235,250,220,0.35)" stroke-width="1.2" stroke-linecap="round"/>
      <g id="rimLayer" fill="#c8b35c" opacity="0.75"></g>
    </g>
  </g>
  <g id="cat"></g>
  <g id="crumbs"></g>
</svg>
<p class="hint">머리를 <b>뒤로 뺐다 호를 그리며</b> 한 입 · 줄 바꿔 더 깊게</p>
<div class="ui"><button id="again">다시</button></div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const inOut = (t) => { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  /** 처음에 살짝 뒤로 갔다가 나가는 이징 (예비 동작) */
  const backInOut = (t, s) => {
    t = clamp(t, 0, 1); const c = s * 1.525;
    return t < 0.5 ? (Math.pow(2 * t, 2) * ((c + 1) * 2 * t - c)) / 2
                   : (Math.pow(2 * t - 2, 2) * ((c + 1) * (t * 2 - 2) + c) + 2) / 2;
  };
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // ---------------- 잎 모양 ----------------
  const B = { x: 42, y: 212 }, T = { x: 372, y: 96 };
  const dl = Math.hypot(T.x - B.x, T.y - B.y);
  const DIR = { x: (T.x - B.x) / dl, y: (T.y - B.y) / dl };
  const UP = { x: DIR.y, y: -DIR.x };                       // 잎의 위쪽 가장자리 방향
  const mid = (u) => ({ x: lerp(B.x, T.x, u) + UP.x * 12 * Math.sin(Math.PI * u),
                        y: lerp(B.y, T.y, u) + UP.y * 12 * Math.sin(Math.PI * u) });
  const halfW = (u) => 80 * Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.75) * (1 - 0.25 * u);
  const edge = (u) => { const m = mid(u), w = halfW(u) + 0.8 * Math.sin(u * 140); return { x: m.x + UP.x * w, y: m.y + UP.y * w }; };
  const lower = (u) => { const m = mid(u), w = halfW(u) * 0.92; return { x: m.x - UP.x * w, y: m.y - UP.y * w }; };

  (function buildLeaf() {
    let d = '';
    for (let i = 0; i <= 120; i++) { const p = edge(i / 120); d += (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }
    for (let i = 120; i >= 0; i--) { const p = lower(i / 120); d += 'L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }
    d += 'Z';
    $('leaf').setAttribute('d', d);
    $('leafShade').setAttribute('d', d);
    let v = '';
    const m0 = mid(0), m1 = mid(0.97);
    v += `M${m0.x} ${m0.y}`;
    for (let i = 1; i <= 40; i++) { const p = mid(0.97 * i / 40); v += `L${p.x.toFixed(1)} ${p.y.toFixed(1)}`; }
    for (let i = 1; i <= 8; i++) {      // 곁맥: 가운데맥에서 가장자리 쪽으로 비스듬히
      const u = i / 9.5, m = mid(u);
      for (const s of [1, -1]) {
        const w = halfW(u + 0.07) * (s > 0 ? 0.8 : 0.72);
        const ex = m.x + DIR.x * w * 0.55 + UP.x * w * s, ey = m.y + DIR.y * w * 0.55 + UP.y * w * s;
        const cx = m.x + DIR.x * w * 0.1 + UP.x * w * 0.6 * s, cy = m.y + DIR.y * w * 0.1 + UP.y * w * 0.6 * s;
        v += `M${m.x.toFixed(1)} ${m.y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
      }
    }
    $('veins').setAttribute('d', v);
    const stem = $('stem');
    stem.setAttribute('d', `M${B.x} ${B.y}Q${B.x - 14} ${B.y + 8} ${B.x - 30} ${B.y + 26}`);
    stem.setAttribute('stroke', '#4f8a4c'); stem.setAttribute('stroke-width', '4');
  })();

  // 몸이 놓이는 선: 가장자리에서 OFF 만큼 안쪽. 호 길이 표로 저장
  const OFF = 23;
  const LINE = [];
  (function buildLine() {
    let s = 0, prev = null;
    for (let i = 0; i <= 300; i++) {
      const u = 0.03 + 0.94 * i / 300, m = mid(u), w = halfW(u) - OFF;
      const p = { x: m.x + UP.x * w, y: m.y + UP.y * w, u };
      if (prev) s += Math.hypot(p.x - prev.x, p.y - prev.y);
      p.s = s; LINE.push(p); prev = p;
    }
  })();
  function onLine(s) {
    let lo = 0, hi = LINE.length - 1;
    s = clamp(s, 0, LINE[hi].s);
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (LINE[m].s < s) lo = m; else hi = m; }
    const a = LINE[lo], b = LINE[hi], k = (s - a.s) / Math.max(1e-6, b.s - a.s);
    return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), u: lerp(a.u, b.u, k) };
  }
  function inward(u) {               // 가장자리에서 잎 안쪽을 향하는 단위 벡터
    const a = edge(u - 0.004), b = edge(u + 0.004);
    let nx = -(b.y - a.y), ny = b.x - a.x;
    const l = Math.hypot(nx, ny); nx /= l; ny /= l;
    const m = mid(u), e = edge(u);
    if (nx * (m.x - e.x) + ny * (m.y - e.y) < 0) { nx = -nx; ny = -ny; }
    return { x: nx, y: ny };
  }

  // ---------------- 애벌레 SVG ----------------
  const N = 10, GAP = 8.4;
  const RAD = [6.2, 6.9, 7.3, 7.5, 7.5, 7.4, 7.2, 6.8, 6.1, 5.2];
  const cat = $('cat');
  const shadowG = el('g', { fill: '#000', opacity: '0.22' }, cat);
  const legG = el('g', { fill: '#3f6a22' }, cat);
  const segG = el('g', {}, cat);
  const shadows = [], segs = [], legs = [];
  for (let i = 0; i < N; i++) shadows.push(el('ellipse', { rx: RAD[i], ry: RAD[i] }, shadowG));
  for (let i = N - 1; i >= 1; i--) {
    const g = el('g', {}, segG);
    el('ellipse', { rx: RAD[i] * 0.95, ry: RAD[i], fill: 'url(#segFill)', stroke: 'rgba(35,70,18,0.45)', 'stroke-width': 0.8 }, g);
    if (i < N - 1) for (const s of [-1, 1]) {
      el('circle', { cx: 0, cy: s * RAD[i] * 0.62, r: RAD[i] * 0.2, fill: '#f2d34a' }, g);
      el('circle', { cx: 0, cy: s * RAD[i] * 0.62, r: RAD[i] * 0.11, fill: '#1f2612' }, g);
    }
    segs[i] = g;
  }
  [N - 1, 7, 6, 5, 4].forEach((i) => { legs.push({ i, a: el('ellipse', { rx: 1.8, ry: 1.3 }, legG), b: el('ellipse', { rx: 1.8, ry: 1.3 }, legG) }); });
  const stripe = el('polyline', { fill: 'none', stroke: 'rgba(244,240,170,0.85)', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, cat);
  const headG = el('g', {}, cat);
  const antL = el('path', { d: 'M3 -3 L6.5 -5.5', stroke: '#2c3a16', 'stroke-width': 0.8, 'stroke-linecap': 'round' }, headG);
  const antR = el('path', { d: 'M3 3 L6.5 5.5', stroke: '#2c3a16', 'stroke-width': 0.8, 'stroke-linecap': 'round' }, headG);
  el('ellipse', { rx: 6, ry: 5.6, fill: 'url(#headFill)', stroke: 'rgba(35,60,15,0.6)', 'stroke-width': 0.8 }, headG);
  el('circle', { cx: 2.6, cy: -3, r: 0.8, fill: '#1b2210' }, headG);
  el('circle', { cx: 2.6, cy: 3, r: 0.8, fill: '#1b2210' }, headG);
  const jawL = el('path', { d: 'M4.6 -0.4 Q7 -1.6 7.4 0.2', fill: 'none', stroke: '#2a1c0c', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, headG);
  const jawR = el('path', { d: 'M4.6 0.4 Q7 1.6 7.4 -0.2', fill: 'none', stroke: '#2a1c0c', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, headG);

  // ---------------- 상태 ----------------
  const biteLayer = $('biteLayer'), rimLayer = $('rimLayer'), crumbG = $('crumbs');
  let S, crumbs = [];

  function reset() {
    biteLayer.textContent = ''; rimLayer.textContent = '';
    crumbs.forEach((c) => c.el.remove()); crumbs = [];
    const s0 = LINE.find((p) => p.u >= 0.37).s;
    S = {
      sHead: s0, base: [], wave: null,
      mode: 'think', t: 0, dur: 0.8,
      row: 0, k: 0, plan: [],
      from: null, tgt: null, head: null, jaw: 0, chew: 0,
      growing: [], time: 0, done: 0,
    };
    for (let i = 0; i < N; i++) S.base.push(s0 - i * GAP);
    planStation();
  }

  function planStation() {
    // 한 자리에서 2줄 x 3입: 첫 줄은 가장자리, 둘째 줄은 반대 방향으로 더 깊게
    S.plan = [];
    const sp = 6.4;
    for (let row = 0; row < 2; row++) {
      for (let k = 0; k < 3; k++) {
        const kk = row ? 2 - k : k;
        const ds = -5 + kk * sp + (row ? sp * 0.5 : 0) + rand(-1.2, 1.2);
        const u = onLine(S.sHead + ds).u;
        const e = edge(u), n = inward(u);
        const r = 5.2 * rand(0.85, 1.15);
        const depth = row ? r * 1.05 + rand(0, 1.5) : r * 0.25 + rand(-0.5, 1);
        const x = e.x + n.x * depth, y = e.y + n.y * depth;
        S.plan.push({ x, y, r, n, hx: x + n.x * 4.5, hy: y + n.y * 4.5 });   // hx,hy: 입이 원 가운데 오도록 머리 중심은 조금 안쪽
      }
    }
    S.k = 0;
  }

  function addBite(b) {
    const c = el('circle', { cx: b.x.toFixed(2), cy: b.y.toFixed(2), r: 0 }, biteLayer);
    const rim = el('circle', { cx: b.x.toFixed(2), cy: b.y.toFixed(2), r: 0 }, rimLayer);
    S.growing.push({ c, rim, r: b.r, t: 0 });
    const n = Math.floor(rand(2, 5));
    for (let i = 0; i < n; i++) {
      const sz = rand(0.8, 1.9);
      const pts = [0, 1, 2].map((j) => { const a = j * 2.1 + rand(-0.4, 0.4); return (Math.cos(a) * sz).toFixed(2) + ',' + (Math.sin(a) * sz).toFixed(2); }).join(' ');
      const e = el('polygon', { points: pts, fill: Math.random() < 0.5 ? '#6fae5c' : '#8cc46f' }, crumbG);
      const out = rand(14, 34);
      crumbs.push({ el: e, x: b.x - b.n.x * b.r * 0.6, y: b.y - b.n.y * b.r * 0.6,
                    vx: -b.n.x * out + rand(-10, 10), vy: -b.n.y * out + rand(-6, 8), rot: rand(0, 360),
                    vr: rand(-400, 400), life: 0, max: rand(0.8, 1.4), delay: i * rand(0.04, 0.12) });
    }
  }

  // ---------------- 루프 ----------------
  let last = null;
  function frame(now) {
    const dt = last == null ? 0 : clamp((now - last) / 1000, 0, 0.05);
    last = now;
    S.time += dt; S.t += dt;
    const p = clamp(S.t / S.dur, 0, 1);
    const restHead = onLine(S.sHead);

    if (S.mode === 'think') {                 // 잠깐 멈칫 (다음 입 고르기)
      if (S.from) { const e = smooth(p); S.head = { x: lerp(S.from.x, restHead.x, e), y: lerp(S.from.y, restHead.y, e) }; }
      if (p >= 1) startReach();
    } else if (S.mode === 'reach') {
      // 뒤로 살짝 뺐다가 호를 그리며 쭉
      const e = backInOut(p, 0.9);
      const mx = (S.from.x + S.tgt.x) / 2 + S.tgt.n.x * 5, my = (S.from.y + S.tgt.y) / 2 + S.tgt.n.y * 5;
      const q = 1 - e;
      S.head = { x: q * q * S.from.x + 2 * q * e * mx + e * e * S.tgt.x, y: q * q * S.from.y + 2 * q * e * my + e * e * S.tgt.y };
      S.jaw = lerp(S.jaw, 1, dt * 14);                       // 다가가며 턱을 벌림
      if (p >= 1) { S.mode = 'chew'; S.t = 0; S.dur = rand(0.32, 0.55); S.jaw = 0; addBite(S.plan[S.k]); }
    } else if (S.mode === 'chew') {
      // 덥석 문 뒤 살짝 물러나며 우물우물
      const b = S.plan[S.k];
      const back = smooth(p) * 1.4;
      const jit = Math.sin(S.time * 62) * 0.35;
      S.head = { x: b.hx + b.n.x * (back + jit), y: b.hy + b.n.y * (back + jit) };
      S.jaw = 0.5 + 0.5 * Math.sin(S.time * 55);
      if (p >= 1) {
        S.k++;
        if (S.k >= S.plan.length) { S.mode = 'retract'; S.t = 0; S.dur = 0.4; S.from = S.head; }
        else if (S.k === 3) { S.mode = 'think'; S.t = 0; S.dur = rand(0.15, 0.4); S.from = S.head; }
        else startReach();
      }
    } else if (S.mode === 'retract') {
      const e = inOut(p);
      S.head = { x: lerp(S.from.x, restHead.x, e), y: lerp(S.from.y, restHead.y, e) };
      S.jaw = lerp(S.jaw, 0, dt * 10);
      if (p >= 1) {
        S.head = null;
        const next = onLine(S.sHead + 18);
        if (next.u > 0.86) { S.mode = 'full'; S.t = 0; S.dur = 3.2; }
        else { S.mode = 'shift'; S.t = 0; S.dur = rand(1.0, 1.3); S.wave = 18; }
      }
    } else if (S.mode === 'shift') {
      // 꼬리부터 파동으로 한 칸 앞으로
      if (p >= 1) {
        for (let i = 0; i < N; i++) S.base[i] += S.wave;
        S.sHead = S.base[0]; S.wave = null; S.from = null; S.head = null;
        planStation();
        S.mode = 'think'; S.t = 0; S.dur = rand(0.25, 0.6);
      }
    } else if (S.mode === 'full') {          // 다 먹음: 쉬다가 처음부터
      if (p >= 1 && !S.done) {
        S.done = 1;
        $('scene').classList.add('fade');
        setTimeout(() => { reset(); $('scene').classList.remove('fade'); }, 550);
      }
    }

    // 물린 자국이 0 → 제 크기로 빠르게 (깨무는 느낌)
    S.growing = S.growing.filter((g) => {
      g.t += dt;
      const k = 1 - Math.pow(1 - clamp(g.t / 0.12, 0, 1), 3);
      g.c.setAttribute('r', (g.r * k).toFixed(2));
      g.rim.setAttribute('r', ((g.r + 1.4) * k).toFixed(2));
      return g.t < 0.12;
    });

    // ---- 마디 위치 ----
    const sArr = [];
    for (let i = 0; i < N; i++) {
      let s = S.base[i];
      if (S.mode === 'shift') {
        const order = (N - 1 - i) / (N - 1), WIN = 0.45;
        s += S.wave * smooth((p - order * (1 - WIN)) / WIN);
      }
      sArr.push(s);
    }
    const pos = sArr.map(onLine);
    const lifted = sArr.map((s, i) => s - S.base[i]);
    // 머리: 쉬는 자리 ↔ 무는 자리. 목(1~2번 마디)은 베지어로 휨
    let head = S.head || pos[0];
    if (S.head) pos[0] = head;
    if (S.head) {
      // 목(1~3번 마디): 4번 마디와 머리 사이에 고르게, 몸 쪽으로 살짝 휘게
      const NK = 4, aK = pos[NK], ctl = onLine(sArr[0] - GAP * 2);
      const bx = (ctl.x - (aK.x + head.x) / 2) * 0.6, by = (ctl.y - (aK.y + head.y) / 2) * 0.6;
      for (let i = 1; i < NK; i++) {
        const t = (NK - i) / NK, b = 4 * t * (1 - t);
        pos[i] = { x: lerp(aK.x, head.x, t) + bx * b, y: lerp(aK.y, head.y, t) + by * b };
      }
    }
    const ang = pos.map((_, i) => {
      const a = pos[Math.max(0, i - 1)], b = pos[Math.min(N - 1, i + 1)];
      return Math.atan2(a.y - b.y, a.x - b.x);
    });
    ang[0] = Math.atan2(pos[0].y - pos[1].y, pos[0].x - pos[1].x);

    // ---- SVG 갱신 ----
    const breathe = 1 + 0.025 * Math.sin(S.time * 2.2);
    for (let i = 0; i < N; i++) {
      const lift = S.mode === 'shift' ? Math.sin(Math.PI * clamp(lifted[i] / S.wave, 0, 1)) : 0;
      const sc = (1 + lift * 0.1) * (i ? breathe : 1);
      const off = 1.6 + lift * 2.5;
      shadows[i].setAttribute('cx', (pos[i].x + off * 0.6).toFixed(2));
      shadows[i].setAttribute('cy', (pos[i].y + off).toFixed(2));
      shadows[i].setAttribute('rx', (RAD[i] * sc).toFixed(2));
      shadows[i].setAttribute('ry', (RAD[i] * sc).toFixed(2));
      if (i) segs[i].setAttribute('transform', `translate(${pos[i].x.toFixed(2)} ${pos[i].y.toFixed(2)}) rotate(${(ang[i] * 57.2958).toFixed(1)}) scale(${sc.toFixed(3)})`);
    }
    legs.forEach((L) => {
      const i = L.i, a = ang[i], nx = -Math.sin(a), ny = Math.cos(a), r = RAD[i];
      for (const [e, s] of [[L.a, -1], [L.b, 1]]) {
        e.setAttribute('cx', (pos[i].x + nx * r * s).toFixed(2)); e.setAttribute('cy', (pos[i].y + ny * r * s).toFixed(2));
      }
    });
    stripe.setAttribute('points', pos.slice(1, N - 1).map((q) => q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' '));
    headG.setAttribute('transform', `translate(${pos[0].x.toFixed(2)} ${pos[0].y.toFixed(2)}) rotate(${(ang[0] * 57.2958).toFixed(1)})`);
    const j = S.jaw * 28;
    jawL.setAttribute('transform', `rotate(${-j} 4.6 -0.4)`);
    jawR.setAttribute('transform', `rotate(${j} 4.6 0.4)`);
    const aw = Math.sin(S.time * 4.1) * 12;
    antL.setAttribute('transform', `rotate(${(-aw).toFixed(1)} 3 -3)`);
    antR.setAttribute('transform', `rotate(${(aw * 0.7).toFixed(1)} 3 3)`);

    // ---- 부스러기: 잎 밖으로 튀어 떨어지며(멀어지며) 작아짐 ----
    crumbs = crumbs.filter((c) => {
      if (c.delay > 0) { c.delay -= dt; c.el.setAttribute('opacity', 0); return true; }
      c.life += dt;
      c.vy += 160 * dt; c.vx *= 1 - dt * 1.2;
      c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      const k = c.life / c.max;
      c.el.setAttribute('transform', `translate(${c.x.toFixed(2)} ${c.y.toFixed(2)}) rotate(${c.rot.toFixed(0)}) scale(${(1 - k * 0.55).toFixed(3)})`);
      c.el.setAttribute('opacity', (k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3).toFixed(2));
      if (k >= 1) { c.el.remove(); return false; }
      return true;
    });

    requestAnimationFrame(frame);
  }

  function startReach() {
    S.from = S.head || onLine(S.sHead);
    const b = S.plan[S.k];
    S.tgt = { x: b.hx, y: b.hy, n: b.n };
    S.mode = 'reach'; S.t = 0; S.dur = rand(0.2, 0.3);
  }

  $('again').addEventListener('click', reset);
  reset();
  requestAnimationFrame(frame);
</script>
</body>
</html>
