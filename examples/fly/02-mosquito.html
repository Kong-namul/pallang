<!doctype html>
<html lang="ko">
<!--
  파리 02 · 모기 접근과 후퇴
  목표(포인터, 없으면 떠도는 '온기')를 향해 남은 거리의 일부만 비스듬히 다가갔다가 → 머뭇(제자리 비행) → 가끔은 목표를 본 채 뒤로 물러남.
  몸은 느리게 위아래로 흔들리고(크기·그림자 거리), 긴 다리 6개의 발끝은 각자 스프링으로 '늦게' 따라와 처지고 흔들림.
  포인터가 빠르게 움직이면 좌우로 번갈아 3~4번 튀며 달아났다가, 멀찍이서 숨을 고른 뒤 다시 슬금슬금 돌아옴 (canvas).
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파리 02 · 모기 접근과 후퇴</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  canvas { touch-action: none; }
</style>
</head>
<body>
<canvas class="fill" id="air"></canvas>
<p class="hint">슬금슬금 다가오다 <b>머뭇 · 후퇴</b> · 손을 빠르게 휘두르면 달아나요</p>

<script>
  /* ---------- 유틸 ---------- */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const damp = (rate, dt) => 1 - Math.exp(-rate * dt);            // 프레임 속도와 무관한 '따라가기' 계수
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

  /* ---------- 캔버스 · 색 ---------- */
  const cv = document.getElementById('air'), ctx = cv.getContext('2d');
  let W = 0, H = 0, S = 0, K = 1;
  let col = {}, dark = false, blob = null, glow = null;
  // 가운데가 진하고 바깥으로 사라지는 둥근 덩이를 원하는 색으로
  function softDot(color, a0, a1) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 2, 32, 32, 32);
    gr.addColorStop(0, 'rgba(0,0,0,' + a0 + ')'); gr.addColorStop(0.5, 'rgba(0,0,0,' + a1 + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, 64, 64);
    return c;
  }
  function readColors() {
    const cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();
    dark = matchMedia('(prefers-color-scheme: dark)').matches;
    col = { ink: v('--ink'), accent: v('--accent'), wing: dark ? '#cfe6e0' : '#ffffff' };
    blob = softDot(dark ? '#000000' : '#24302a', 0.5, 0.26);      // 그림자
    glow = softDot(col.accent, 0.5, 0.2);                           // 목표의 온기
  }
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

  const U = () => 6 * K + 3;                                        // 몸 단위 길이(px)
  const margin = () => Math.max(16 * K + 8, S * 0.07);
  const nearR = () => S * 0.13 + 14;                                // 이보다 가까워지면 겁먹고 물러남

  /* ---------- 포인터 ---------- */
  const ptr = { x: 0, y: 0, on: false, speed: 0, lastT: 0, recent: 0, tap: false };
  const wander = { x: 0, y: 0 };
  function movePtr(e) {
    const now = performance.now();
    if (ptr.on && now - ptr.lastT < 150) {
      const sp = Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y) / (Math.max(8, now - ptr.lastT) / 1000);
      ptr.speed = lerp(ptr.speed, sp, 0.5);
    }
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.lastT = now; ptr.on = true; ptr.recent = 2.5;
  }
  cv.addEventListener('pointermove', movePtr);
  cv.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') ptr.tap = true; movePtr(e); });   // 손가락은 '갑자기' 나타남
  const liftPtr = (e) => { if (e.type !== 'pointerup' || e.pointerType !== 'mouse') ptr.on = false; };
  cv.addEventListener('pointerup', liftPtr); cv.addEventListener('pointercancel', liftPtr); cv.addEventListener('pointerleave', liftPtr);

  /* ---------- 모기: 상태 ----------
     hover(머뭇) → approach(조금 다가감) / retreat(물러남) → hover … · dart(놀라 튐) → sulk(멀찍이서 숨 고름) */
  const mq = {
    x: 0, y: 0, vx: 0, vy: 0, h: 0, bob: 0,
    mode: 'hover', mt: 0, dur: 0.5,
    gx: 0, gy: 0, gain: 3, vmax: 60,            // 지금 향하는 지점과 그리로 가는 세기·최대 속력
    dartN: 0, dartSide: 1, away: 0, cool: 0,
    legs: [],
  };
  // 다리 3쌍: 몸에 붙는 곳(root) · 쉴 때 발끝(rx, ry) · 스프링 세기(k)·감쇠(c) · 처지는 정도(lag, 초)
  const LEG_DEF = [
    { root: 0.32, rx: 1.9, ry: 1.5, k: 85, c: 7, lag: 0.07 },      // 앞다리: 짧게 앞으로
    { root: 0.05, rx: 0.1, ry: 3.0, k: 65, c: 6, lag: 0.1 },       // 가운뎃다리: 옆으로 길게
    { root: -0.22, rx: -3.4, ry: 1.7, k: 42, c: 4.5, lag: 0.15 },  // 뒷다리: 가장 길고 가장 늦게 따라옴
  ];
  for (const d of LEG_DEF) for (const sd of [-1, 1]) mq.legs.push({ d, sd, x: 0, y: 0, vx: 0, vy: 0, f: rand(1.2, 2.6), p: rand(0, TAU) });

  function resetLegs() {
    const u = U(), c = Math.cos(mq.h), s = Math.sin(mq.h);
    for (const L of mq.legs) { const ry = L.d.ry * L.sd; L.x = mq.x + (L.d.rx * c - ry * s) * u; L.y = mq.y + (L.d.rx * s + ry * c) * u; L.vx = L.vy = 0; }
  }
  function resize() {
    const nw = innerWidth, nh = innerHeight;
    if (!nw || !nh) return;
    const first = !W, kx = W ? nw / W : 1, ky = H ? nh / H : 1;
    W = nw; H = nh; S = Math.min(W, H); K = clamp(S / 520, 0.55, 1.6);
    const dpr = Math.min(devicePixelRatio || 1, 3);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (first) { mq.x = mq.gx = W * 0.22; mq.y = mq.gy = H * 0.3; }
    else { mq.x *= kx; mq.y *= ky; mq.gx *= kx; mq.gy *= ky; }
    resetLegs();
  }
  addEventListener('resize', resize);
  resize();

  function setGoal(x, y, vmax, gain, dur, mode) {
    const m = margin();
    mq.gx = clamp(x, m, W - m); mq.gy = clamp(y, m, H - m);
    mq.vmax = vmax; mq.gain = gain; mq.dur = dur; mq.mode = mode; mq.mt = 0;
  }
  // 머뭇거린 뒤의 다음 한 수: 조금 다가가거나, 물러나거나
  function decide(d, a) {
    const near = nearR();
    if (d < near || Math.random() < 0.28) {
      // 후퇴: 목표를 바라본 채 뒤로 + 옆으로 (다가갈 때보다 빠르게)
      const back = d < near ? rand(0.16, 0.3) * S : rand(0.06, 0.12) * S, side = rand(-0.9, 0.9);
      setGoal(mq.x - Math.cos(a + side) * back, mq.y - Math.sin(a + side) * back, S * 0.55 + 60, 5, rand(0.35, 0.6), 'retreat');
    } else {
      // 접근: 남은 거리의 일부만, 약간 비스듬히
      const step = Math.min(Math.max(d * rand(0.3, 0.55), 18 * K), d - near * 0.6), side = rand(-0.55, 0.55);
      setGoal(mq.x + Math.cos(a + side) * step, mq.y + Math.sin(a + side) * step, S * 0.28 + 30, 3.2, rand(0.5, 1.1), 'approach');
    }
  }
  // 놀라서 튐: 달아나는 방향을 중심으로 좌우 번갈아 짧고 빠르게
  function startDart(away) { mq.dartN = 3 + (Math.random() < 0.5 ? 1 : 0); mq.dartSide = Math.random() < 0.5 ? -1 : 1; mq.away = away; mq.cool = 1.2; nextDart(); }
  function nextDart() {
    if (mq.dartN-- <= 0) {                                             // 다 튀었으면 멀찍이서 숨 고르기
      setGoal(mq.x + mq.vx * 0.06, mq.y + mq.vy * 0.06, S * 0.2 + 30, 3, rand(0.8, 1.6), 'sulk');
      return;
    }
    mq.dartSide = -mq.dartSide;
    const m = margin();
    let x = mq.x, y = mq.y;
    for (let i = 0; i < 5; i++) {
      const a = i < 4 ? mq.away + mq.dartSide * (i % 2 ? -1 : 1) * rand(0.35, 1.25) : Math.atan2(H / 2 - mq.y, W / 2 - mq.x);
      const len = rand(0.12, 0.22) * S;
      x = mq.x + Math.cos(a) * len; y = mq.y + Math.sin(a) * len;
      if (x > m && x < W - m && y > m && y < H - m) break;             // 벽에 막히면 다른 쪽으로
    }
    setGoal(x, y, S * 1.5 + 200, 30, rand(0.07, 0.13), 'dart');
  }

  function update(tg, dt, t) {
    mq.mt += dt; mq.cool -= dt;
    const dx = tg.x - mq.x, dy = tg.y - mq.y, d = Math.hypot(dx, dy) || 1, a = Math.atan2(dy, dx);

    // 빠른 손짓(또는 갑자기 내려온 손가락) → 달아남
    if (ptr.on && mq.mode !== 'dart' && mq.cool <= 0 && Math.hypot(ptr.x - mq.x, ptr.y - mq.y) < S * 0.45 && (ptr.speed > 420 + S * 0.7 || ptr.tap))
      startDart(Math.atan2(mq.y - ptr.y, mq.x - ptr.x));
    ptr.tap = false;

    if (mq.mode === 'dart') { if (mq.mt > mq.dur) nextDart(); }
    else if (mq.mode === 'hover') { if (mq.mt > mq.dur || d < nearR() * 0.55) decide(d, a); }
    else if (mq.mt > mq.dur) { mq.mode = 'hover'; mq.mt = 0; mq.dur = rand(0.25, 0.9); }      // 한 번 움직일 때마다 머뭇

    // 향하는 지점으로: 평소엔 둥실둥실 느리게, 튈 땐 즉시
    let dvx = (mq.gx - mq.x) * mq.gain, dvy = (mq.gy - mq.y) * mq.gain;
    const sp = Math.hypot(dvx, dvy);
    if (sp > mq.vmax) { dvx *= mq.vmax / sp; dvy *= mq.vmax / sp; }
    if (mq.mode !== 'dart') {                                          // 제자리에서도 가만있지 못하는 잔떨림
      dvx += (Math.sin(t * 2.3 + 1) + Math.sin(t * 5.3)) * 5 * K; dvy += (Math.sin(t * 1.9) + Math.sin(t * 4.7 + 2)) * 5 * K;
    }
    const k = damp(mq.mode === 'dart' ? 34 : mq.mode === 'retreat' ? 7 : 4, dt);
    mq.vx += (dvx - mq.vx) * k; mq.vy += (dvy - mq.vy) * k;
    mq.x += mq.vx * dt; mq.y += mq.vy * dt;

    // 머리: 튈 땐 가는 쪽, 평소엔 목표 쪽(느리게 돌고 살짝 갸웃)
    const fleeing = mq.mode === 'dart' && Math.hypot(mq.vx, mq.vy) > 60;
    const hGoal = fleeing ? Math.atan2(mq.vy, mq.vx) : a + Math.sin(t * 1.3) * 0.12;
    mq.h += angDiff(mq.h, hGoal) * damp(fleeing ? 22 : 5, dt);
    // 느린 위아래 흔들림 (-1 ~ 1)
    mq.bob = Math.sin(t * 2.4) * 0.6 + Math.sin(t * 3.9 + 1.3) * 0.4;

    // 다리: 발끝마다 스프링 — 목표는 '제자리 + 속도 반대쪽으로 처진 곳'
    const u = U(), c = Math.cos(mq.h), s = Math.sin(mq.h);
    for (const L of mq.legs) {
      const D = L.d, ry = D.ry * L.sd;
      let lx = -mq.vx * D.lag, ly = -mq.vy * D.lag;
      const ll = Math.hypot(lx, ly), mx = u * 2.4;
      if (ll > mx) { lx *= mx / ll; ly *= mx / ll; }
      const gx = mq.x + (D.rx * c - ry * s) * u + lx + Math.sin(t * L.f + L.p) * u * 0.22;
      const gy = mq.y + (D.rx * s + ry * c) * u + ly + Math.cos(t * L.f * 0.8 + L.p) * u * 0.22;
      L.vx += ((gx - L.x) * D.k - L.vx * D.c) * dt; L.vy += ((gy - L.y) * D.k - L.vy * D.c) * dt;
      L.x += L.vx * dt; L.y += L.vy * dt;
      // 다리 길이 한계 (너무 늘어나지 않게)
      const rx = mq.x + D.root * c * u, rw = mq.y + D.root * s * u, ex = L.x - rx, ey = L.y - rw, el = Math.hypot(ex, ey);
      const max = Math.hypot(D.rx - D.root, D.ry) * u * 1.3;
      if (el > max) { L.x = rx + ex / el * max; L.y = rw + ey / el * max; L.vx *= 0.6; L.vy *= 0.6; }
    }
  }

  /* ============================================================
     모기 그리기 (위에서 본 모습) — 이 부분만 떼어 가도 됨
     mq: { x, y, h(라디안), bob(-1~1), legs: [{ d, sd, x, y }] }
     ============================================================ */
  function drawShadow() {
    const u = U(), alt = 1 + mq.bob * 0.22;                            // 높이 떠오르면 그림자가 멀어지고 흐려짐
    ctx.save(); ctx.translate(mq.x + (9 * K + 5) * alt, mq.y + (13 * K + 7) * alt); ctx.rotate(mq.h);
    ctx.globalAlpha = 0.6 - mq.bob * 0.12;
    ctx.drawImage(blob, -4 * u, -0.9 * u, 6 * u, 1.8 * u);
    ctx.globalAlpha = 0.22 - mq.bob * 0.05;
    ctx.drawImage(blob, -2.6 * u, -2.6 * u, 5.2 * u, 5.2 * u);        // 날개·다리가 만드는 옅은 그늘
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function drawMosquito(t) {
    const sc = 1 + mq.bob * 0.06, u = U() * sc, c = Math.cos(mq.h), s = Math.sin(mq.h);
    // 1) 다리: 몸에서 나와 바깥으로 불룩 휘었다가 발끝으로 늘어짐
    ctx.strokeStyle = col.ink; ctx.lineWidth = Math.max(0.6, u * 0.11); ctx.lineCap = 'round'; ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (const L of mq.legs) {
      const ax = mq.x + (L.d.root * c - 0.3 * L.sd * s) * u, ay = mq.y + (L.d.root * s + 0.3 * L.sd * c) * u;
      const b = u * (L.d.root < 0 ? 1.8 : 1.2) * L.sd;                 // 무릎이 옆으로 나온 정도
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo((ax + L.x) / 2 - s * b, (ay + L.y) / 2 + c * b, L.x, L.y);
    }
    ctx.stroke(); ctx.globalAlpha = 1;

    ctx.save(); ctx.translate(mq.x, mq.y); ctx.rotate(mq.h); ctx.scale(u, u);
    // 2) 가늘고 긴 배(마디 줄무늬) · 가슴 · 머리
    ctx.fillStyle = col.ink;
    ctx.beginPath(); ctx.moveTo(-0.3, -0.27); ctx.quadraticCurveTo(-2.1, -0.37, -3.4, 0); ctx.quadraticCurveTo(-2.1, 0.37, -0.3, 0.27); ctx.fill();
    ctx.strokeStyle = dark ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.3)'; ctx.lineWidth = 0.07;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) { const x = -0.8 - i * 0.48, hh = 0.26 - i * 0.035; ctx.moveTo(x, -hh); ctx.lineTo(x, hh); }
    ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, 0.62, 0.43, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0.8, 0, 0.25, 0, TAU); ctx.fill();
    ctx.fillStyle = col.accent;
    ctx.beginPath(); ctx.arc(0.88, 0.16, 0.1, 0, TAU); ctx.arc(0.88, -0.16, 0.1, 0, TAU); ctx.fill();
    // 3) 긴 침 · 깃털 같은 더듬이
    ctx.strokeStyle = col.ink; ctx.lineCap = 'round';
    ctx.lineWidth = 0.09; ctx.beginPath(); ctx.moveTo(1.0, 0); ctx.lineTo(2.45, 0); ctx.stroke();
    ctx.lineWidth = 0.05; ctx.beginPath();
    for (const sd of [-1, 1]) {
      ctx.moveTo(0.98, 0.1 * sd); ctx.quadraticCurveTo(1.4, 0.2 * sd, 1.75, 0.62 * sd);
      for (let i = 1; i <= 3; i++) { const q = i / 4, x = lerp(1.05, 1.7, q), y = lerp(0.12, 0.56, q) * sd; ctx.moveTo(x, y); ctx.lineTo(x + 0.02, y + 0.2 * sd); }
    }
    ctx.stroke();
    // 4) 날개: 너무 빨라 부채꼴 흐림으로만 보임 + 매 프레임 위치가 바뀌는 날개 두 장
    const wingAt = (th, sd, aFill, aLine) => {
      ctx.beginPath(); ctx.ellipse(0.1 + Math.cos(th) * 1.25, (0.28 + Math.sin(th) * 1.25) * sd, 1.25, 0.3, th * sd, 0, TAU);
      ctx.globalAlpha = aFill; ctx.fillStyle = col.wing; ctx.fill();
      ctx.globalAlpha = aLine; ctx.strokeStyle = col.ink; ctx.lineWidth = 0.045; ctx.stroke();
    };
    for (const sd of [-1, 1]) {
      const mid = 1.78, amp = 0.5;
      ctx.beginPath(); ctx.moveTo(0.1, 0.28 * sd);
      ctx.arc(0.1, 0.28 * sd, 2.5, (mid - amp) * sd, (mid + amp) * sd, sd < 0); ctx.closePath();
      ctx.globalAlpha = 0.2; ctx.fillStyle = col.wing; ctx.fill();
      ctx.globalAlpha = 0.07; ctx.fillStyle = col.ink; ctx.fill();
      wingAt(mid + amp * Math.sin(t * 310 + sd), sd, 0.2, 0.26);
      wingAt(mid - amp * Math.cos(t * 377 + sd * 2), sd, 0.14, 0.18);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ---------- 루프 ---------- */
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000 || 0), t = now / 1000; last = now;
    if (!W) { resize(); return; }

    // 목표: 포인터가 있으면 손, 없으면 천천히 떠도는 온기
    wander.x = W * (0.5 + 0.3 * Math.sin(t * 0.21) + 0.1 * Math.sin(t * 0.53 + 1));
    wander.y = H * (0.5 + 0.28 * Math.sin(t * 0.17 + 2) + 0.1 * Math.sin(t * 0.47));
    if (!ptr.on) ptr.recent -= dt;
    ptr.speed *= Math.exp(-7 * dt);
    const tg = ptr.on || ptr.recent > 0 ? ptr : wander;
    update(tg, dt, t);

    ctx.clearRect(0, 0, W, H);
    const r = (S * 0.09 + 16) * (1 + 0.06 * Math.sin(t * 2.2));
    ctx.globalAlpha = 0.75; ctx.drawImage(glow, tg.x - r, tg.y - r, r * 2, r * 2); ctx.globalAlpha = 1;
    drawShadow();
    drawMosquito(t);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
