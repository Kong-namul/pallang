<!doctype html>
<html lang="ko">
<!--
  나방 02 · 벽에 붙어 쉬다 파르르
  나무껍질(canvas 로 그림)에 삼각 지붕 자세로 붙어 쉼 → 떨림이 점점 커짐(shiver: 19Hz+30Hz, 세기는 t² 로 서서히)
  → 앞날개를 0.12초 만에 젖혀 뒷날개 눈알 무늬를 번쩍(open, 살짝 지나쳤다 돌아옴) → 두 단계로 느리게 접음.
  또는 움찔한 뒤 튀어 올라 불규칙하게 날아가 다른 자리에 내려앉고, 날개를 두 번에 나눠 접으며 몸을 두 번 고쳐 앉음(Perch).
  날개는 나비 키트와 같은 '경첩 사슬'(조각 10개, 바깥이 늦게 따라옴)이라 부드럽게 휨.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나방 02 · 벽에 붙어 쉬다 파르르</title>
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" href="../../assets/moth.css">
<style>
  body { background: #4b3d31; }
  .stage { perspective: 800px; perspective-origin: 50% 50%; touch-action: none; cursor: pointer; }
  .hint { color: #e9dcc8; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
  .hint b { color: #fff6e6; }
</style>
</head>
<body>
<canvas class="fill" id="bg"></canvas>
<div class="stage" id="stage"></div>
<p class="hint">쉬다가 <b>파르르</b> → 눈알 무늬 <b>번쩍</b> 또는 날아가요 · 건드려도 돼요</p>

<script src="../../assets/moth.js"></script>
<script>
  const { makeMoth, Flit, Perch, loop, clamp, lerp, rand, ease, easeOutCubic, easeOutBack, approach, degDiff, RAD, TAU } = MO;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const bark = document.createElement('canvas');
  let W = 0, H = 0, S = 1;

  // ---------- 나무껍질 (한 번 그려 두고 매 프레임 복사) ----------
  function seeded(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function paintBark() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    bark.width = Math.round(W * dpr); bark.height = Math.round(H * dpr);
    const g = bark.getContext('2d'), r = seeded(11), rr = (a, b) => a + r() * (b - a);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const base = g.createLinearGradient(0, 0, W, 0);                 // 둥근 줄기: 양옆이 어두움
    base.addColorStop(0, '#3c3027'); base.addColorStop(0.3, '#6a5746'); base.addColorStop(0.62, '#5d4c3d'); base.addColorStop(1, '#382d25');
    g.fillStyle = base; g.fillRect(0, 0, W, H);
    g.lineCap = 'round'; g.lineJoin = 'round';
    // 세로 골: 구불구불한 어두운 선 + 오른쪽에 밝은 모서리
    let x = -8;
    while (x < W + 8) {
      const w = rr(15, 40) * S, pts = [];
      for (let y = -20; y <= H + 20; y += 26 * S) pts.push([x + rr(-5, 5) * S, y + rr(-6, 6) * S]);
      const path = (dx) => { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0] + dx, p[1]) : g.moveTo(p[0] + dx, p[1]))); };
      path(0); g.strokeStyle = 'rgba(26,19,14,' + rr(0.5, 0.85).toFixed(2) + ')'; g.lineWidth = rr(2, 5.5) * S; g.stroke();
      path(2.4 * S); g.strokeStyle = 'rgba(222,196,158,.13)'; g.lineWidth = 1.4 * S; g.stroke();
      // 판 안쪽 결
      for (let k = 0; k < 3; k++) {
        const gx = x + w * rr(0.2, 0.85), y0 = rr(-20, H), len = rr(40, 160) * S;
        g.beginPath(); g.moveTo(gx, y0); g.quadraticCurveTo(gx + rr(-4, 4) * S, y0 + len / 2, gx + rr(-3, 3) * S, y0 + len);
        g.strokeStyle = r() < 0.5 ? 'rgba(24,18,13,.28)' : 'rgba(226,202,166,.10)'; g.lineWidth = rr(0.8, 1.8) * S; g.stroke();
      }
      // 가로로 갈라진 틈
      for (let y = rr(10, 70) * S; y < H; y += rr(46, 120) * S) {
        const cw = w * rr(0.5, 1.05), sag = rr(-4, 6) * S;
        g.beginPath(); g.moveTo(x + 2 * S, y); g.quadraticCurveTo(x + cw / 2, y + sag, x + cw, y + rr(-3, 3) * S);
        g.strokeStyle = 'rgba(22,16,12,.6)'; g.lineWidth = rr(1.4, 3.2) * S; g.stroke();
        g.beginPath(); g.moveTo(x + 2 * S, y + 2.2 * S); g.quadraticCurveTo(x + cw / 2, y + sag + 2.2 * S, x + cw, y + 2.2 * S);
        g.strokeStyle = 'rgba(226,202,166,.12)'; g.lineWidth = 1.1 * S; g.stroke();
      }
      x += w;
    }
    // 이끼·지의류 얼룩: 작은 조각이 다닥다닥 모인 덩어리
    const n = Math.round(clamp(W * H / 70000, 3, 10));
    for (let i = 0; i < n; i++) {
      const cx = rr(0, W), cy = rr(0, H), cnt = 14 + (r() * 22 | 0), R = rr(12, 30) * S;
      for (let k = 0; k < cnt; k++) {
        const a = rr(0, TAU), d = Math.pow(r(), 0.7) * R, rad = rr(1.2, 4.2) * S;
        g.fillStyle = r() < 0.65 ? 'rgba(134,150,118,.42)' : 'rgba(176,180,150,.34)';
        g.beginPath(); g.ellipse(cx + Math.cos(a) * d * 0.8, cy + Math.sin(a) * d * 1.5, rad * rr(0.7, 1.3), rad, rr(0, 3), 0, TAU); g.fill();
      }
    }
    // 옹이
    const kx = W * rr(0.62, 0.86), ky = H * rr(0.18, 0.36);
    for (let k = 5; k > 0; k--) {
      g.beginPath(); g.ellipse(kx, ky, k * 5.5 * S, k * 7.5 * S, 0.2, 0, TAU);
      g.strokeStyle = 'rgba(24,17,12,' + (0.2 + k * 0.07).toFixed(2) + ')'; g.lineWidth = 1.6 * S; g.stroke();
    }
    g.fillStyle = 'rgba(20,14,10,.55)'; g.beginPath(); g.ellipse(kx, ky, 5 * S, 7 * S, 0.2, 0, TAU); g.fill();
    if (matchMedia('(prefers-color-scheme: dark)').matches) { g.fillStyle = 'rgba(8,10,12,.3)'; g.fillRect(0, 0, W, H); }
  }

  // 나뭇잎 사이로 드는 빛: 천천히 떠다니는 밝은 얼룩
  const dapples = Array.from({ length: 6 }, () => ({ cx: rand(0.1, 0.9), cy: rand(0.1, 0.9), ax: rand(0.05, 0.16), ay: rand(0.04, 0.12),
                                                     fx: rand(0.11, 0.3), fy: rand(0.09, 0.26), px: rand(0, TAU), py: rand(0, TAU), r: rand(70, 150), x: 0, y: 0 }));
  function drawScene(t) {
    ctx.drawImage(bark, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const d of dapples) {
      d.x = W * (d.cx + d.ax * Math.sin(t * d.fx + d.px)); d.y = H * (d.cy + d.ay * Math.sin(t * d.fy + d.py));
      const R = d.r * S, gr = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, R);
      gr.addColorStop(0, 'rgba(255,232,180,.11)'); gr.addColorStop(1, 'rgba(255,232,180,0)');
      ctx.fillStyle = gr; ctx.fillRect(d.x - R, d.y - R, R * 2, R * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  const dappleAt = (x, y) => dapples.reduce((s, d) => s + Math.max(0, 1 - Math.hypot(x - d.x, y - d.y) / (d.r * S)), 0);

  // ---------- 나방 ----------
  const m = makeMoth(stage, { tone: 'umber', heading: -18, sunX: 0.42, sunY: 0.9, shadowShift: 0.8 });
  const flit = new Flit(m, { speed: 215, kick: 80, altBase: 30, altRange: 10 });
  const perch = new Perch(m, flit, { flyMin: 1.2, flyMax: 2.6 });
  function resize() {
    const first = !W;
    const ox = W ? m.x / W : 0.5, oy = H ? m.y / H : 0.5;
    W = stage.clientWidth; H = stage.clientHeight;
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = clamp(Math.min(W / 420, H / 320), 0.55, 1.9);
    m.scale = 1.25 * S; perch.S = S; perch.margin = 78 * S; flit.kick = 80 * S;
    m.x = first ? W * 0.5 : ox * W; m.y = first ? H * 0.5 : oy * H;
    paintBark();
  }
  resize();
  addEventListener('resize', resize);

  // 내려앉을 자리: 지금 자리에서 멀고, 머리는 대체로 위쪽
  perch.pick = () => {
    const mx = 62 * S, my = 58 * S;
    for (let i = 0; i < 12; i++) {
      const x = rand(mx, W - mx), y = rand(my, H - my - 14);
      if (Math.hypot(x - last.x, y - last.y) > Math.min(W, H) * 0.3 || i === 11) {
        const heading = rand(-55, 55), k = 20 * m.scale;       // (x, y) = 접은 날개 삼각형의 가운데 → 뿌리는 조금 앞
        return { x: x + Math.sin(heading / RAD) * k, y: y - Math.cos(heading / RAD) * k, heading };
      }
    }
  };
  const last = { x: W / 2, y: H / 2 };
  perch.onTakeoff = () => { last.x = m.x; last.y = m.y; };

  // ---------- 기분: calm → shiver → flash / takeoff ----------
  let mode = 'calm', mt = 0, wait = rand(1.4, 2.4), dur = 1.6, runs = 0;
  let fl = null;                       // 번쩍 동작의 시간표
  let tweak = null;                    // 번쩍 뒤 고쳐 앉기
  const go = (s) => { mode = s; mt = 0; };
  function startFlash(quick) {
    const hold = rand(0.7, 1.3);
    fl = { snap: quick ? 0.09 : 0.12, hold, pulse: Math.random() < 0.55 ? rand(0.3, 0.55) * hold : -1,
           close1: 0.42, pause: rand(0.25, 0.5), close2: 0.6, then: Math.random() < (quick ? 0.25 : 0.4) ? 'takeoff' : 'calm' };
    go('flash');
  }
  function leap(fromX, fromY, power) {
    if (fromX == null) { const h = m.heading / RAD; fromX = m.x - Math.sin(h) * 20; fromY = m.y + Math.cos(h) * 20; }   // 기본: 머리 쪽으로
    if (perch.takeoff(fromX, fromY, power)) { m.open = 0; go('away'); }
  }

  // ---------- 포인터 ----------
  const ptr = { x: -999, y: -999, on: false };
  stage.addEventListener('pointermove', (e) => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = e.pointerType === 'mouse' || e.buttons > 0; });
  stage.addEventListener('pointerleave', () => { ptr.on = false; });
  addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') ptr.on = false; });
  stage.addEventListener('pointerdown', (e) => {
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
    if (!perch.resting) return;
    if (m.hit(ptr.x, ptr.y, 14)) {
      if (mode === 'calm') startFlash(true);               // 처음 건드리면 눈알 무늬로 겁주기
      else leap(ptr.x, ptr.y, 1.25);                       // 또 건드리면 달아남
    } else if (m.hit(ptr.x, ptr.y, 90 * S) && mode === 'calm') { dur = rand(0.7, 1.1); go('shiver'); }
  });

  loop((dt, t) => {
    mt += dt;
    const near = ptr.on && m.hit(ptr.x, ptr.y, 60 * S);
    let aim = near ? 0.8 : 0;

    if (mode === 'calm') {
      m.shiver = approach(m.shiver, 0, 8, dt); m.open = approach(m.open, 0, 8, dt);
      if (perch.state === 'rest') {
        m.fold = 1 - 0.012 * (1 + Math.sin(t * 1.3));          // 숨 쉬듯 아주 조금
        if (tweak) {                                           // 번쩍 뒤 한 번 고쳐 앉음
          const e = easeOutCubic((mt - tweak.at) / 0.18);
          m.heading = tweak.h + tweak.dh * e;
          m.fold -= 0.12 * Math.sin(Math.PI * clamp((mt - tweak.at) / 0.36, 0, 1));
          if (mt > tweak.at + 0.4) tweak = null;
        }
        wait -= dt * (near ? 2.2 : 1);
        if (wait <= 0 && !tweak) { dur = rand(1.3, 2.1); go('shiver'); }
      }
    } else if (mode === 'shiver') {                            // 떨림이 서서히 커짐 + 날개가 조금 들림
      const k = clamp(mt / dur, 0, 1);
      m.shiver = 0.08 + 0.92 * Math.pow(k, 2.2);
      m.fold = 1 - 0.1 * k * k;
      aim = Math.max(aim, k);
      if (k >= 1) {
        runs++;
        if (runs % 3 === 2 || Math.random() < 0.3) leap(null, null, 1);   // 세 번에 한 번은 꼭 날아감
        else startFlash(false);
      }
    } else if (mode === 'flash') {
      const f = fl, t1 = f.snap, t2 = t1 + f.hold, t3 = t2 + f.close1, t4 = t3 + f.pause, t5 = t4 + f.close2;
      m.fold = approach(m.fold, 1, 12, dt);
      aim = 1;
      if (mt < t1) { m.open = easeOutBack(mt / t1, 2.2); m.shiver = 0.3; }           // 번쩍: 지나쳤다 돌아옴
      else if (mt < t2) {
        let o = 1 + 0.035 * Math.sin((mt - t1) * 21) * Math.exp(-(mt - t1) * 2.5);   // 펼친 채 잔떨림
        if (f.pulse > 0) {                                                           // 한 번 더 번쩍
          const q = (mt - t1 - f.pulse) / 0.3;
          if (q > 0 && q < 1) o -= 0.5 * (q < 0.55 ? ease(q / 0.55) : 1 - easeOutBack((q - 0.55) / 0.45, 2.4));
        }
        m.open = o; m.shiver = approach(m.shiver, 0.1, 6, dt);
      }
      else if (mt < t3) { m.open = lerp(1, 0.42, ease((mt - t2) / f.close1)); m.shiver = 0; }
      else if (mt < t4) { m.open = 0.42 + 0.02 * Math.sin(mt * 30); m.shiver = 0.22; }  // 반쯤 접고 머뭇
      else if (mt < t5) { m.open = lerp(0.42, 0, ease((mt - t4) / f.close2)); m.shiver = approach(m.shiver, 0, 8, dt); }
      else {
        m.open = 0;
        if (f.then === 'takeoff') leap(null, null, 0.9);
        else { tweak = { at: rand(0.2, 0.5), h: m.heading, dh: rand(4, 9) * (Math.random() < 0.5 ? -1 : 1) }; wait = rand(2, 3.6); go('calm'); }
      }
    } else if (mode === 'away') {
      aim = 0;
      if (perch.state === 'rest') { wait = rand(1.8, 3.2); tweak = null; go('calm'); }
    }
    m.antAim = approach(m.antAim, aim, 6, dt);

    perch.step(dt, W, H);
    m.update(dt);
    // 빛: 왼쪽 위 햇빛 + 지나가는 빛 얼룩
    drawScene(t);
    const dap = dappleAt(m.x, m.y);
    m.setLight(0.9 + 0.16 * Math.min(1.4, dap));
    m.lit[0] += 0.06; m.lit[1] -= 0.05;
    m.shadowAlpha = 0.85 + 0.15 * Math.min(1, dap);
    m.render();
  });
</script>
</body>
</html>
