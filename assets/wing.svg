  <g fill="#FFF7EA">
    <circle cx="107" cy="22" r="1.7"/><circle cx="104" cy="33" r="1.9"/><circle cx="98" cy="45" r="1.7"/>
    <circle cx="90" cy="55" r="1.4"/><circle cx="97" cy="12" r="1.3"/><circle cx="86" cy="11" r="1.1"/>
    <circle cx="94" cy="92" r="1.7"/><circle cx="88" cy="104" r="1.9"/><circle cx="78" cy="114" r="1.7"/>
    <circle cx="64" cy="120" r="1.6"/><circle cx="48" cy="120" r="1.4"/><circle cx="32" cy="112" r="1.4"/>
  </g>
</svg>
