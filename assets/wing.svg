<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 120 130">
  <!-- 오른쪽 날개 한 장 (몸통 쪽이 x=0). 왼쪽 날개는 CSS에서 좌우 반전해서 씀 -->
  <defs>
    <linearGradient id="fore" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E5641C"/>
      <stop offset="1" stop-color="#F8B04A"/>
    </linearGradient>
    <linearGradient id="hind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86E1F"/>
      <stop offset="1" stop-color="#F6A63E"/>
    </linearGradient>
    <radialGradient id="root" cx="0" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1D1712" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1D1712" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 뒷날개 -->
  <path fill="#1D1712" d="M6 66 C40 66 80 68 96 80 C102 98 86 118 62 124 C40 128 20 112 10 94 C6 84 4 74 6 66 Z"/>
  <path fill="url(#hind)" d="M14 72 C34 70 54 72 66 78 C60 92 50 104 40 112 C28 104 18 92 14 80 Z"/>
  <path fill="url(#hind)" d="M70 80 C80 82 88 86 90 92 C86 104 76 112 64 116 C58 114 52 112 46 112 C56 102 64 92 70 80 Z"/>
  <!-- 앞날개 -->
  <path fill="#1D1712" d="M4 52 C20 30 50 8 112 8 C118 20 108 44 92 60 C70 66 40 66 6 64 Z"/>
  <path fill="url(#fore)" d="M14 52 C28 36 46 24 70 18 C60 32 52 44 46 58 C34 59 22 58 14 56 Z"/>
  <path fill="url(#fore)" d="M52 58 C58 42 68 28 80 18 C88 24 92 36 86 52 C76 57 64 58 52 58 Z"/>
  <path fill="#FBD38A" d="M84 16 C94 14 104 14 108 16 C106 24 100 32 94 38 C92 30 90 22 84 16 Z"/>
  <!-- 날개 뿌리 쪽 어두운 털 -->
  <rect x="0" y="20" width="60" height="100" fill="url(#root)"/>
